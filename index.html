/* ---------- Project Overview ---------- */
async function renderProjectOverview(p){ const tasks=await dbFilter('tasks',t=>t.projectId===p.id); const openTasks=tasks.filter(t=>!['Completed','Cancelled'].includes(t.status)); const overdue=openTasks.filter(t=>t.dueDate&&relDays(t.dueDate)<0);
  const issues=await dbFilter('issues',i=>i.projectId===p.id&&!['Resolved','Closed'].includes(i.status));
  const approvals=await dbFilter('approvals',a=>a.projectId===p.id&&a.status==='Pending');
  const budget=await dbFilter('budget_items',b=>b.projectId===p.id);
  const est=budget.reduce((s,b)=>s+b.estimated,0)||p.estimatedBudget||0; const actual=budget.reduce((s,b)=>s+b.actual,0); const committed=budget.reduce((s,b)=>s+b.committed,0);
  const remaining=est-actual;
  const miles=await dbFilter('milestones',m=>m.projectId===p.id);
  const recentAct=(await dbFilter('audit_logs',a=>a.projectId===p.id)).sort((a,b)=>b.timestamp.localeCompare(a.timestamp)).slice(0,8);
  const phases=await dbFilter('project_phases',ph=>ph.projectId===p.id);
  const curPh=phases.find(x=>x.status==='in_progress');

  const life=PHASES.map(ph=>{ const f=phases.find(x=>x.name===ph); const st=f?f.status:'pending'; return `<span class="lcstep ${st==='completed'?'done':st==='in_progress'?'cur':''}"><span class="dot"></span>${ph}</span>`; }).join('');

  const budgetPct=est? Math.round((actual/est)*100):0;
  const schedulePct=p.progress||0;

  return header(p.name, `${p.code} · ${p.type}`, (can('internal',p)?`<button class="btn btn-primary" onclick="openQuickAdd()">${icon('plus',15)} Add</button><button class="btn" onclick="openEditProject('${p.id}')">${icon('pencil',15)} Edit</button>`:''))
  + `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-8px 0 18px">${statusBadge(p.status)} ${healthBadge(p.health)} <span class="badge b-neutral">${icon('pin',13)} ${esc(p.city)}, ${esc(p.country)}</span></div>`

  + `<div class="card" style="margin-bottom:16px"><div class="card-body">
     <div class="mini" style="margin-bottom:8px">Project timeline</div><div class="lifecycle">${life}</div>
     <div style="display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap">
       <div style="flex:1;min-width:140px"><div class="muted" style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span>Overall progress</span><b>${p.progress||0}%</b></div>${progressBar(p.progress||0)}</div>
       <div style="flex:1;min-width:140px"><div class="muted" style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span>Construction</span><b>${p.constructionProgress||0}%</b></div>${progressBar(p.constructionProgress||0,'p-info')}</div>
     </div>
     </div></div>`

  + `<div class="grid g4" style="margin-bottom:16px">
     ${miniStat('Budget remaining',fmtMoney(remaining,p.currency),remaining<0?'var(--danger)':'var(--ok)')}
     ${miniStat('Open issues',issues.length+'','var(--danger)')}
     ${miniStat('Overdue tasks',overdue.length+'','var(--danger)')}
     ${miniStat('Pending approvals',approvals.length+'','var(--info)')}
     </div>`

  + `<div class="card" style="margin-bottom:16px"><div class="card-head"><span class="card-title">Project information</span></div><div class="card-body">
     <div class="grid g4" style="gap:18px">
     ${infoItem('Project code',p.code)}${infoItem('Start date',fmtDate(p.startDate))}${infoItem('Target completion',fmtDate(p.targetDate))}${infoItem('Current phase',p.currentPhase||p.status)}
     </div></div></div>`

  + `<div class="grid g3">
     <div class="card"><div class="card-body"><div class="mini">Client</div><div style="font-weight:600;margin-top:6px">${esc(p.clientName||'Maya Hartono')}</div><div class="muted" style="font-size:12px">${esc(p.clientCompany||'Hartono Family')}</div><div class="divider"></div><div class="mini">Project manager</div><div style="font-weight:600;margin-top:6px">${esc(p.pm||'Nadia Rahman')}</div></div></div>
     <div class="card"><div class="card-body"><div class="mini">Schedule</div><div style="font-size:13px;margin-top:6px">Start: <b>${fmtDate(p.startDate)}</b></div><div style="font-size:13px">Target: <b>${fmtDate(p.targetDate)}</b></div><div class="divider"></div><div class="mini">Budget</div><div style="font-size:16px;font-weight:700;margin-top:4px">${fmtMoney(est,p.currency)}</div><div class="muted" style="font-size:12px">${budgetPct}% spent · ${fmtMoney(remaining,p.currency)} remaining</div></div></div>
     <div class="card"><div class="card-body"><div class="mini">Health</div><div style="margin-top:6px">${healthBadge(p.health)}</div>${p.healthReason?`<div class="muted" style="font-size:12px;margin-top:6px">${esc(p.healthReason)}</div>`:''}${can('internal',p)?`<button class="btn btn-sm" style="margin-top:10px" onclick="openHealthOverride('${p.id}')">${icon('pencil',13)} Override health</button>`:''}</div></div>
     </div>`

  + (recentAct.length? `<div class="section-title">Recent activity</div><div class="card"><div class="card-body" style="padding:6px 16px">${recentAct.slice(0,6).map(a=>`<div style="display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--border)"><span class="avatar" style="background:${pickColor(a.userName||'')}">${initials(a.userName)}</span><div style="flex:1"><span style="font-weight:500">${esc(a.userName)}</span> <span class="muted">${esc(a.action)} <b style="color:var(--text)">${esc(a.entity)}</b></span><div class="muted" style="font-size:11px">${timeAgo(a.timestamp)}</div></div></div>`).join('')}</div></div>`:'');
}
function miniStat(label,val,color){ return `<div class="card"><div class="card-body"><div class="mini">${esc(label)}</div><div style="font-size:24px;font-weight:800;letter-spacing:-.02em;color:${color||'var(--text)'}">${val}</div></div></div>`; }
function infoItem(label,val){ return `<div><div class="mini">${esc(label)}</div><div style="font-size:14px;font-weight:600;margin-top:4px">${esc(val||'—')}</div></div>`; }
window.openHealthOverride=async id=>{ const p=await dbGet('projects',id); openModal(`<div class="modal-head"><h3 style="margin:0">Override project health</h3><button class="iconbtn" onclick="closeAllModals()">${icon('close')}</button></div><div class="modal-body"><div class="field"><label>Health status</label><select id="hohealth"><option value="healthy" ${p.health==='healthy'?'selected':''}>Healthy</option><option value="attention" ${p.health==='attention'?'selected':''}>Attention</option><option value="at_risk" ${p.health==='at_risk'?'selected':''}>At Risk</option></select></div><div class="field"><label>Reason</label><textarea id="horeason">${esc(p.healthReason||'')}</textarea></div></div><div class="modal-foot"><button class="btn" onclick="closeAllModals()">Cancel</button><button class="btn btn-primary" id="hosave">Save</button></div>`); $('#hosave').onclick=async()=>{ await updateRecord('projects',id,{health:$('#hohealth').value,healthReason:$('#horeason').value},'Project health'); toast('Health updated','ok'); closeAllModals(); routeProject(id,'overview'); }; };
window.openEditProject=async id=>{ const p=await dbGet('projects',id); openModal(`<div class="modal-head"><h3 style="margin:0">Edit project</h3><button class="iconbtn" onclick="closeAllModals()">${icon('close')}</button></div><div class="modal-body"><div class="field"><label>Name</label><input id="ep-name" value="${esc(p.name)}"/></div><div class="field"><label>Code</label><input id="ep-code" value="${esc(p.code)}"/></div><div class="row"><div class="field"><label>Type</label><select id="ep-type">${PROJECT_TYPES.map(t=>`<option ${p.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Status</label><select id="ep-status">${PROJECT_STATUS.map(t=>`<option ${p.status===t?'selected':''}>${t}</option>`).join('')}</select></div></div><div class="field"><label>Description</label><textarea id="ep-desc">${esc(p.description||'')}</textarea></div><div class="row"><div class="field"><label>Start date</label><input id="ep-start" type="date" value="${p.startDate||''}"/></div><div class="field"><label>Target date</label><input id="ep-target" type="date" value="${p.targetDate||''}"/></div></div></div><div class="modal-foot"><button class="btn btn-danger" onclick="closeAllModals();archiveProject('${id}')">Archive</button><button class="btn btn-primary" id="ep-save">Save</button></div>`,{w:600}); $('#ep-save').onclick=async()=>{ await updateRecord('projects',id,{name:$('#ep-name').value,code:$('#ep-code').value,type:$('#ep-type').value,status:$('#ep-status').value,description:$('#ep-desc').value,startDate:$('#ep-start').value,targetDate:$('#ep-target').value},'Project'); toast('Project updated','ok'); closeAllModals(); routeProject(id,'overview'); }; };
async function archiveProject(id){ await updateRecord('projects',id,{status:'Archived'},'Project'); toast('Project archived','ok'); location.hash='#/projects'; navigate(); }

/* ---------- Brief ---------- */
async function renderBrief(p){ const brief=p.brief||{}; const sections=[['Client requirements',brief.clientRequirements||'Four-bedroom family residence with generous living spaces and a private garden.','clientRequirements'],['Project objectives',brief.objectives||'Deliver a sustainable two-storey residence that maximizes natural light and connects indoor/outdoor living.','objectives'],['Design goals',brief.designGoals||'Contemporary tropical architecture with locally-sourced materials.','designGoals'],['Functional requirements',brief.functionalRequirements||'Four bedrooms, open-plan living, home office, and service areas.','functionalRequirements'],['Spatial requirements',brief.spatialRequirements||'Approximately 420 m² total built area over two floors.','spatialRequirements'],['User requirements',brief.userRequirements||'Family of five plus occasional guests, with accessibility for elderly parents.','userRequirements'],['Site constraints',brief.siteConstraints||'Sloping site, 8m frontage, view corridor to the north.','siteConstraints'],['Budget constraints',brief.budgetConstraints||'Target total budget of IDR 4.25 billion.','budgetConstraints'],['Schedule constraints',brief.scheduleConstraints||'Handover by March 2026 before the rainy season.','scheduleConstraints'],['Regulatory requirements',brief.regulatoryRequirements||'Compliance with local IMB and building codes.','regulatoryRequirements'],['Sustainability requirements',brief.sustainabilityRequirements||'Cross-ventilation, rainwater harvesting, solar-ready roof.','sustainabilityRequirements'],['Special requirements',brief.specialRequirements||'Dedicated art studio with north-facing light.','specialRequirements']];
  return header('Project Brief','Structured brief with version history','')
  + `<div class="grid g2">${sections.map(s=>`<div class="card"><div class="card-body"><div class="mini" style="margin-bottom:8px">${esc(s[0])}</div><div style="font-size:13px;line-height:1.65;color:var(--text-2);white-space:pre-wrap">${esc(s[1])}</div></div></div>`).join('')}</div>`;
}

/* ---------- Planning ---------- */
async function renderPlanning(p){ const phases=await dbFilter('project_phases',ph=>ph.projectId===p.id); const miles=await dbFilter('milestones',m=>m.projectId===p.id);
  return header('Planning','Phases, milestones, and goals','<button class="btn btn-primary" onclick="openMilestoneForm(\''+p.id+'\')">'+icon('plus',15)+' Milestone</button>')
  + `<div class="card" style="margin-bottom:16px"><div class="card-body"><div class="mini" style="margin-bottom:12px">Project phases</div>${(phases.length?phases:PHASES.slice(0,5).map((nm,i)=>({id:'tmp-'+i,name:nm,status:i===0?'in_progress':'pending',progress:0}))).map(ph=>`<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)"><span class="badge ${ph.status==='completed'?'b-ok':ph.status==='in_progress'?'b-accent':'b-neutral'}"><span class="dot"></span>${esc(ph.name)}</span><div style="flex:1">${progressBar(ph.progress||0)}</div><span class="muted" style="font-size:12px;width:40px;text-align:right">${ph.progress||0}%</span></div>`).join('')}</div></div>`
  + (miles.length?`<div class="card"><div class="card-head"><span class="card-title">Milestones</span></div><div class="card-body"><div style="display:flex;flex-direction:column;gap:0">${miles.map(m=>`<div style="display:flex;gap:14px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)"><div style="text-align:center;flex-shrink:0"><div style="font-size:11px;font-weight:700">${fmtDate(m.dueDate).split(',')[0]}</div><div class="muted" style="font-size:10px">${fmtDate(m.dueDate).split(',')[1]||''}</div></div><div style="width:2px;height:40px;background:${m.status==='Completed'?'var(--ok)':'var(--border-2)'};flex-shrink:0"></div><div style="flex:1"><div style="font-weight:600">${esc(m.title)}</div><div class="muted" style="font-size:12px">${esc(m.phase||'')}</div></div>${statusBadge(m.status)}</div>`).join('')}</div></div></div>`:'');
}
async function openMilestoneForm(projectId){ openModal(`<div class="modal-head"><h3 style="margin:0">Add milestone</h3><button class="iconbtn" onclick="closeAllModals()">${icon('close')}</button></div><div class="modal-body"><div class="field"><label>Title *</label><input id="ms-title"/></div><div class="field"><label>Phase</label><select id="ms-phase">${PHASES.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Due date</label><input id="ms-due" type="date"/></div></div><div class="modal-foot"><button class="btn" onclick="closeAllModals()">Cancel</button><button class="btn btn-primary" id="ms-save">Add</button></div>`); $('#ms-save').onclick=async()=>{ const t=$('#ms-title').value.trim(); if(!t){ toast('Title required','err'); return; } await createRecord('milestones',{projectId,title:t,phase:$('#ms-phase').value,dueDate:$('#ms-due').value,status:'Pending'},'Milestone'); toast('Milestone added','ok'); closeAllModals(); routeProject(projectId,'planning'); }; }

/* ---------- Design ---------- */
async function renderDesign(p){ const opts=await dbFilter('design_options',o=>o.projectId===p.id);
  return header('Design','Concepts, options, materials and decisions','<button class="btn btn-primary" onclick="openDesignOptionForm(\''+p.id+'\')">'+icon('plus',15)+' Design option</button>')
  + `<div class="hgrid">${opts.map(o=>`<div class="card"><div class="card-body"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div style="min-width:0"><div style="font-weight:700" class="truncate">${esc(o.name)}</div><div class="muted" style="font-size:12px">Rev ${o.revision||1}</div></div>${statusBadge(o.status)}</div><p style="font-size:13px;color:var(--text-2);margin:10px 0;line-height:1.6">${esc(o.description||'')}</p><div class="row" style="gap:8px"><button class="btn btn-sm" onclick="openDesignComments('${o.id}')">${icon('chat',13)} Discuss</button>${can('internal',p)?`<button class="btn btn-sm btn-primary" onclick="requestApproval('Design','${o.id}','${(o.name||'').replace(/'/g,'')}')">${icon('stamp',13)} Request approval</button>`:''}</div></div></div>`).join('')||emptyState('draw','No design options','Create your first design option to explore concepts.','Add option','openDesignOptionForm(\''+p.id+'\')')}</div>`;
}
async function openDesignOptionForm(projectId){ openModal(`<div class="modal-head"><h3 style="margin:0">Design option</h3><button class="iconbtn" onclick="closeAllModals()">${icon('close')}</button></div><div class="modal-body"><div class="field"><label>Name *</label><input id="do-name" placeholder="Option C — Alternative massing"/></div><div class="field"><label>Description</label><textarea id="do-desc"></textarea></div><div class="field"><label>Revision</label><input id="do-rev" type="number" value="1" min="1"/></div><div class="field"><label>Status</label><select id="do-status">${DESIGN_STATUS.map(s=>`<option>${s}</option>`).join('')}</select></div></div><div class="modal-foot"><button class="btn" onclick="closeAllModals()">Cancel</button><button class="btn btn-primary" id="do-save">Save</button></div>`); $('#do-save').onclick=async()=>{ const n=$('#do-name').value.trim(); if(!n){ toast('Name required','err'); return; } await createRecord('design_options',{projectId,name:n,description:$('#do-desc').value,revision:+$('#do-rev').value||1,status:$('#do-status').value,images:[]},'Design option'); toast('Design option created','ok'); closeAllModals(); routeProject(projectId,'design'); }; }
function openDesignComments(id){ location.hash='#/projects/'+state.project.id+'/discussions'; navigate(); toast('Discuss in the project discussions','ok'); }

/* ---------- Drawings ---------- */
async function renderDrawings(p){ const dr=await dbFilter('drawings',d=>d.projectId===p.id); const discs=await dbFilter('drawing_revisions',r=>dr.some(d=>d.id===r.drawingId));
  return header('Drawing Register',`${dr.length} drawings`, (can('internal',p)?`<button class="btn btn-primary" onclick="openDrawingForm('${p.id}')">${icon('plus',15)} Add drawing</button>`:''))
  + (dr.length? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Number</th><th>Title</th><th>Discipline</th><th>Type</th><th>Revision</th><th>Status</th><th>Author</th><th>Date</th></tr></thead><tbody>${dr.map(d=>`<tr style="cursor:pointer" onclick="openDrawingDetail('${d.id}')"><td class="mono" style="font-weight:600">${esc(d.number)}</td><td><a href="javascript:void(0)" class="rlink">${esc(d.title)}</a></td><td>${esc(d.discipline)}</td><td>${esc(d.type)}</td><td class="mono">${esc(d.revision)}</td><td>${statusBadge(d.status)}</td><td>${esc(d.author)}</td><td class="muted">${fmtDate(d.date)}</td></tr>`).join('')}</tbody></table></div>` : emptyState('draw','No drawings','The drawing register is empty. Add your first drawing.','Add drawing','openDrawingForm(\''+p.id+'\')'));
}
async function openDrawingForm(projectId){ openModal(`<div class="modal-head"><h3 style="margin:0">Add drawing</h3><button class="iconbtn" onclick="closeAllModals()">${icon('close')}</button></div><div class="modal-body"><div class="row"><div class="field"><label>Drawing number *</label><input id="dw-num" placeholder="A-103"/></div><div class="field"><label>Title</label><input id="dw-title" placeholder="Second Floor Plan"/></div></div><div class="row"><div class="field"><label>Discipline</label><select id="dw-disc">${DISCIPLINES.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Type</label><select id="dw-type">${DRAWING_TYPES.map(x=>`<option>${x}</option>`).join('')}</select></div></div><div class="row"><div class="field"><label>Author</label><input id="dw-author" value="${esc(state.user.name)}"/></div><div class="field"><label>Reviewer</label><input id="dw-reviewer"/></div></div><div class="field"><label>Notes</label><textarea id="dw-notes"></textarea></div></div><div class="modal-foot"><button class="btn" onclick="closeAllModals()">Cancel</button><button class="btn btn-primary" id="dw-save">Add drawing</button></div>`); $('#dw-save').onclick=async()=>{ const n=$('#dw-num').value.trim(); if(!n){ toast('Number required','err'); return; } const d=await createRecord('drawings',{projectId,number:n,title:$('#dw-title').value||'Untitled',discipline:$('#dw-disc').value,type:$('#dw-type').value,revision:'Rev 01',status:'Draft',author:$('#dw-author').value,reviewer:$('#dw-reviewer').value,date:new Date().toISOString().slice(0,10),notes:$('#dw-notes').value},'Drawing'); await createRecord('drawing_revisions',{drawingId:d.id,revisionNumber:'Rev 01',date:new Date().toISOString().slice(0,10),author:d.author,description:'Initial issue',status:'Draft'},'Drawing revision'); toast('Drawing added','ok'); closeAllModals(); routeProject(projectId,'drawings'); }; }
async function openDrawingDetail(id){ const d=await dbGet('drawings',id); const revs=await dbFilter('drawing_revisions',r=>r.drawingId===id); revs.sort((a,b)=>b.revisionNumber.localeCompare(a.revisionNumber));
  openModal(`<div class="modal-head"><div><h3 style="margin:0;font-size:15px">${esc(d.number)} — ${esc(d.title)}</h3><div class="muted" style="font-size:11px">${esc(d.discipline)} · ${esc(d.type)}</div></div><button class="iconbtn" onclick="closeAllModals()">${icon('close')}</button></div>
  <div class="modal-body">
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">${statusBadge(d.status)} <span class="badge b-neutral">${esc(d.revision)}</span> <span class="badge b-neutral">${esc(d.author)}</span> <span class="badge b-neutral">${fmtDate(d.date)}</span></div>
    <div class="mini" style="margin-bottom:8px">Revision history</div>
    <div style="display:flex;flex-direction:column;gap:0">${revs.map(r=>`<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)"><span class="badge b-accent mono">${esc(r.revisionNumber)}</span><div style="flex:1"><div style="font-size:13px;font-weight:500">${esc(r.description)}</div><div class="muted" style="font-size:11px">${esc(r.author)} · ${fmtDate(r.date)}</div></div>${statusBadge(r.status)}</div>`).join('')}</div>
    <div class="divider"></div>
    <div class="mini" style="margin-bottom:8px">Discussion</div>
    <div id="dw-disc"></div>
    <textarea id="dw-msg" placeholder="Comment on this drawing…" style="margin-top:8px"></textarea>
    <button class="btn btn-primary" id="dw-send" style="margin-top:8px">${icon('send',14)} Comment</button>
    <div class="divider"></div>
    <button class="btn" onclick="newRevision('${id}')">${icon('plus',14)} Add revision</button>
    ${can('internal',state.project)?`<button class="btn btn-primary" onclick="requestApproval('Drawing','${id}','${(d.number+' '+d.title).replace(/'/g,'')}')">${icon('stamp',14)} Request approval</button>`:''}
  </div>`);
  await loadDrawingDiscussion(id); $('#dw-send').onclick=()=>{ const msg=$('#dw-msg').value.trim(); if(!msg) return; addDiscussionMessage('d-'+id,msg); $('#dw-msg').value=''; loadDrawingDiscussion(id); };
}
async function loadDrawingDiscussion(id){ const el=$('#dw-disc'); const disc=await dbFind('discussions',d=>d.attachedId===id&&d.attachedType==='Drawing'); const msgs=disc? await dbFilter('discussion_messages',m=>m.discussionId===disc.id):[]; el.innerHTML=msgs.length? msgs.map(m=>`<div style="padding:8px 0;border-bottom:1px solid var(--border)"><span class="avatar" style="background:${pickColor(m.userName)};vertical-align:middle;margin-right:8px">${initials(m.userName)}</span><b>${esc(m.userName)}</b><div class="muted" style="font-size:11px;margin-left:36px">${timeAgo(m.createdAt)}</div><div style="margin-left:36px;font-size:13px;color:var(--text-2);margin-top:3px">${esc(m.text)}</div></div>`).join(''):'<p class="muted">No discussion yet.</p>'; }
async function addDiscussionMessage(discId,text){ const dm={id:uid(),discussionId:discId,userId:state.user.id,userName:state.user.name,text,createdAt:nowISO(),attachment:null}; await dbPut('discussion_messages',dm); await enqueue('discussion_messages','create',dm); }
window.newRevision=async id=>{ const d=await dbGet('drawings',id); const revs=await dbFilter('drawing_revisions',r=>r.drawingId===id); const next=revs.length+1; openModal(`<div class="modal-head"><h3 style="margin:0">New revision</h3><button class="iconbtn" onclick="closeAllModals()">${icon('close')}</button></div><div class="modal-body"><div class="field"><label>Revision</label><input value="Rev ${String(next).padStart(2,'0')}" disabled/></div><div class="field"><label>Description *</label><textarea id="rev-desc"></textarea></div><div class="field"><label>Status</label><select id="rev-status"><option>Draft</option><option>Internal Review</option><option>Client Review</option><option>Approved</option></select></div></div><div class="modal-foot"><button class="btn" onclick="closeAllModals()">Cancel</button><button class="btn btn-primary" id="rev-save">Create revision</button></div>`); $('#rev-save').onclick=async()=>{ const desc=$('#rev-desc').value.trim(); if(!desc){ toast('Description required','err'); return; } const st=$('#rev-status').value; await createRecord('drawing_revisions',{drawingId:id,revisionNumber:'Rev '+String(next).padStart(2,'0'),date:new Date().toISOString().slice(0,10),author:state.user.name,description:desc,status:st},'Drawing revision'); await updateRecord('drawings',id,{revision:'Rev '+String(next).padStart(2,'0'),status:st==='Approved'?'Approved':(st==='Client Review'?'Under Review':st)},'Drawing'); toast('Revision created','ok'); closeAllModals(); routeProject(state.project.id,'drawings'); }; };

/* ---------- Project documents ---------- */
async function renderProjectDocs(p){ const docs=await dbFilter('documents',d=>d.projectId===p.id); const cats=[...new Set(docs.map(d=>d.category))];
  return header('Documents',`${docs.length} files`, (can('internal',p)?`<button class="btn btn-primary" onclick="openUploadForm('${p.id}')">${icon('upload',15)} Upload</button>`:''))
  + (docs.length? `<div class="pillfield" style="margin-bottom:14px">${cats.map(c=>`<span class="chip clickable docfilter" data-cat="${c}">${esc(c)}</span>`).join('')}<span class="chip clickable docfilter active" data-cat="">All</span></div><div id="doctable">${docTable(docs)}</div>` : emptyState('doc','No documents','Upload specifications, contracts, and reports.','Upload document','openUploadForm(\''+p.id+'\')'));
  $$('.docfilter').forEach(ch=>ch.onclick=()=>{ $$('.docfilter').forEach(x=>x.classList.remove('active')); ch.classList.add('active'); const cat=ch.getAttribute('data-cat'); $('#doctable').innerHTML=docTable(cat? docs.filter(d=>d.category===cat):docs); bindDocTable(); });
}
function docTable(docs){ return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Name</th><th>Category</th><th>Version</th><th>Size</th><th>Uploaded by</th><th>Date</th></tr></thead><tbody>${docs.map(d=>`<tr><td><div style="display:flex;align-items:center;gap:10px"><span style="color:var(--accent)">${icon('doc',18)}</span><a href="javascript:void(0)" class="rlink docopen" data-id="${d.id}">${esc(d.name)}</a></div></td><td>${esc(d.category)}</td><td class="mono">v${d.version||1}</td><td class="muted">${esc(d.size||'—')}</td><td>${esc(d.uploadedBy||'')}</td><td class="muted">${fmtDate(d.createdAt)}</td></tr>`).join('')}</tbody></table></div>`; }
function bindDocTable(){ $$('.docopen').forEach(a=>a.onclick=()=>openDocDetail(a.getAttribute('data-id'))); }
async function openDocDetail(id){ const d=await dbGet('documents',id); openModal(`<div class="modal-head"><h3 style="margin:0;font-size:15px" class="truncate">${esc(d.name)}</h3><button class="iconbtn" onclick="closeAllModals()">${icon('close')}</button></div><div class="modal-body"><div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">${statusBadge(d.category)} <span class="badge b-neutral">v${d.version||1}</span> <span class="badge b-neutral">${esc(d.size||'—')}</span></div><div class="muted" style="margin-bottom:14px">Uploaded by ${esc(d.uploadedBy||'Unknown')} · ${fmtDate(d.createdAt)}</div><div class="row"><button class="btn" onclick="downloadDoc('${id}')">${icon('download',15)} Download</button><button class="btn" onclick="renameDoc('${id}')">${icon('pencil',15)} Rename</button>${can('internal',state.project)?`<button class="btn btn-danger" onclick="closeAllModals();confirmDialog('Delete document','This will permanently remove "${esc(d.name)}".','Delete','1',()=>delDoc('${id}'))">${icon('trash',15)} Delete</button>`:''}</div></div>`); }
window.downloadDoc=id=>{ toast('Document downloaded (demo)','ok'); }; window.renameDoc=id=>{ openModal(`<div class="modal-head"><h3 style="margin:0">Rename</h3><button class="iconbtn" onclick="closeAllModals()">${icon('close')}</button></div><div class="modal-body"><input id="rn-name"/></div><div class="modal-foot"><button class="btn btn-primary" id="rn-save">Save</button></div>`); $('#rn-save').onclick=async()=>{ await updateRecord('documents',id,{name:$('#rn-name').value},'Document'); toast('Renamed','ok'); closeAllModals(); routeProject(state.project.id,'documents'); }; }; window.delDoc=async id=>{ await deleteRecord('documents',id,'Document'); toast('Document deleted','ok'); routeProject(state.project.id,'documents'); };
async function openUploadForm(projectId){ projectId=projectId||state.project?.id; openModal(`<div class="modal-head"><h3 style="margin:0">Upload document</h3><button class="iconbtn" onclick="closeAllModals()">${icon('close')}</button></div><div class="modal-body"><label class="card" style="display:block;padding:26px;text-align:center;cursor:pointer;border-style:dashed">${icon('upload',26)}<div style="font-weight:600;margin-top:8px">Choose file</div><div class="muted">PDF, DOCX, XLSX, JPG, PNG, or CSV</div><input type="file" id="up-file" style="display:none"/></label><div id="up-name" class="muted" style="margin:10px 0"></div><div class="field"><label>Category</label><select id="up-cat">${DOC_CATEGORIES.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field"><label>Tags (comma separated)</label><input id="up-tags" placeholder="spec, final"/></div></div><div class="modal-foot"><button class="btn" onclick="closeAllModals()">Cancel</button><button class="btn btn-primary" id="up-save">Upload</button></div>`); $('#up-file').onchange=e=>{ const f=e.target.files[0]; if(f) $('#up-name').textContent=f.name+' ('+Math.round(f.size/1024)+' KB)'; }; $('#up-save').onclick=async()=>{ const f=$('#up-file').files[0]; const name=f?f.name:'Untitled document'; const size=f?Math.round(f.size/1024)+' KB':'—'; if(!projectId){ toast('Select a project first','err'); return; } await createRecord('documents',{projectId,name,category:$('#up-cat').value,version:1,size,uploadedBy:state.user.name,tags:($('#up-tags').value||'').split(',').map(t=>t.trim()).filter(Boolean)},'Document entry'); toast('Document uploaded','ok'); closeAllModals(); routeProject(projectId,'documents'); }; }

/* ---------- Project tasks ---------- */
async function renderProjectTasks(p){ const tasks=await dbFilter('tasks',t=>t.projectId===p.id); const view=state.taskView||'list';
  return header('Tasks',`${tasks.length} tasks`, (can('internal',p)?`<button class="btn btn-primary" onclick="openTaskForm('${p.id}')">${icon('plus',15)} New task</button>`:''))
  + taskTable(tasks,await dbAll('projects'));
}
function taskTable(tasks,projects){ const nameOf=id=>{ const p=projects.find(x=>x.id===id); return p?p.name:''; };
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Task</th><th>Project</th><th>Assignee</th><th>Priority</th><th>Status</th><th>Due</th></tr></thead><tbody>${tasks.map(t=>`<tr style="cursor:pointer" class="taskrow" data-id="${t.id}"><td><a href="javascript:void(0)" class="rlink">${esc(t.title)}</a>${t.checklist&&t.checklist.length?`<div class="muted" style="font-size:11px">${t.checklist.filter(c=>c.done).length}/${t.checklist.length} checklist</div>`:''}</td><td class="muted">${esc(nameOf(t.projectId))}</td><td>${esc(t.assigneeName||t.assigneeId||'—')}</td><td>${priorityBadge(t.priority)}</td><td>${statusBadge(t.status)}</td><td class="muted ${t.dueDate&&relDays(t.dueDate)<0&&!['Completed','Cancelled'].includes(t.status)?'':''}" style="${t.dueDate&&relDays(t.dueDate)<0&&!['Completed','Cancelled'].includes(t.status)?'color:var(--danger);font-weight:600':'' }">${t.dueDate?fmtDate(t.dueDate):'—'}</td></tr>`).join('')||'<tr><td colspan="6">'+emptyState('check','No tasks','Add tasks to organize the work.','New task','openTaskForm()')+'</td></tr>'}</tbody></table></div>`; }
function bindTaskTable(){ $$('.taskrow').forEach(r=>r.onclick=()=>openTaskDetail(r.getAttribute('data-id'))); }

window.toggleCheck=async (taskId,chkId,val)=>{ const t=await dbGet('tasks',taskId); t.checklist=t.checklist.map(c=>c.id===chkId?{...c,done:val}:c); await updateRecord('tasks',taskId,{checklist:t.checklist},'Task'); toast('Checklist updated','ok'); };
window.addTaskComment=async id=>{ const v=$('#td-comment').value.trim(); if(!v) return; await createRecord('task_comments',{taskId:id,userId:state.user.id,userName:state.user.name,text:v},'Task comment'); $('#td-comment').value=''; openTaskDetail(id); };
window.delTask=async id=>{ const t=await dbGet('tasks',id); await deleteRecord('tasks',id,'Task'); toast('Task deleted','ok'); routeProject(t.projectId,'tasks'); };

/* ---------- Schedule ---------- */
async function renderSchedule(p){ const tasks=await dbFilter('tasks',t=>t.projectId===p.id&&t.dueDate&&t.startDate); const miles=await dbFilter('milestones',m=>m.projectId===p.id);
  return header('Schedule','Gantt-style timeline','')
  + `<div class="card"><div class="card-body">${gantt(p,tasks,miles)}</div></div>`;
}
function gantt(p,tasks,miles){ const all=[...tasks.map(t=>({name:t.title,due:t.dueDate,start:t.startDate||t.dueDate,pct:t.status==='Completed'?100:t.status==='In Progress'?50:0,type:'Task'})),...miles.map(m=>({name:m.title,due:m.dueDate,start:m.dueDate,pct:m.status==='Completed'?100:m.status==='In Progress'?50:0,type:'Milestone'}))];
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `<div class="prog p-ok" style="margin-bottom:16px"><div style="width:${p.progress||0}%"></div></div><div class="muted" style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:14px"><span>${fmtDate(p.startDate)}</span><span>${p.progress||0}% complete</span><span>${fmtDate(p.targetDate)}</span></div><div style="display:flex;flex-direction:column;gap:0">${all.map(g=>{ const d=new Date(g.due); return `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)"><div style="width:140px;flex-shrink:0;font-weight:500;font-size:13px" class="truncate">${esc(g.name)}</div><div style="flex:1;display:flex;align-items:center;gap:8px"><div class="prog ${g.pct===100?'p-ok':g.pct>0?'p-info':''}" style="flex:1"><div style="width:${g.pct}%"></div></div><span class="muted" style="font-size:11px;width:34px">${g.pct}%</span><span class="muted" style="font-size:11px">${g.type==='Milestone'?'◆ ':''}${months[d.getMonth()]} ${d.getDate()}</span></div></div>`; }).join('')}</div>`;
}

/* ---------- Budget ---------- */
async function renderBudget(p){ const items=await dbFilter('budget_items',b=>b.projectId===p.id); const est=items.reduce((s,b)=>s+(b.estimated||0),0)||p.estimatedBudget||0; const committed=items.reduce((s,b)=>s+(b.committed||0),0); const actual=items.reduce((s,b)=>s+(b.actual||0),0); const remaining=est-actual; const pctUsed=est?Math.round(actual/est*100):0;
  const cats=['Design','Labor','Materials','Equipment','Contractor','Consultant','Permit','Transportation','Other'];
  return header('Budget',`${fmtMoney(est,p.currency)} total budget`, (can('internal',p)?`<button class="btn btn-primary" onclick="openBudgetItemForm('${p.id}')">${icon('plus',15)} Add item</button>`:''))
  + `<div class="grid g4" style="margin-bottom:16px">${miniStat('Estimated',fmtMoney(est,p.currency),'' )}${miniStat('Committed',fmtMoney(committed,p.currency),'var(--info)')}${miniStat('Actual',fmtMoney(actual,p.currency),'var(--warn)')}${miniStat('Remaining',fmtMoney(remaining,p.currency),remaining<0?'var(--danger)':'var(--ok)')}</div>
  <div class="card" style="margin-bottom:16px"><div class="card-body"><div class="muted" style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px"><span>Budget used</span><b>${pctUsed}%</b></div>${progressBar(pctUsed,pctUsed>100?'p-danger':pctUsed>85?'p-warn':'p-ok')}${pctUsed>85?`<div class="muted" style="color:${pctUsed>100?'var(--danger)':'var(--warn)'};margin-top:8px;font-size:12px">${icon('warn',14)} ${pctUsed>100?'Budget exceeded!':'Approaching budget limit.'}</div>`:''}</div></div>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Item</th><th>Category</th><th>Estimated</th><th>Committed</th><th>Actual</th><th>Remaining</th></tr></thead><tbody>${items.map(b=>`<tr><td style="font-weight:500">${esc(b.name)}</td><td>${esc(b.category)}</td><td>${fmtMoney(b.estimated,p.currency)}</td><td>${fmtMoney(b.committed,p.currency)}</td><td>${fmtMoney(b.actual,p.currency)}</td><td style="${(b.estimated-b.actual)<0?'color:var(--danger);font-weight:600':''}">${fmtMoney((b.estimated||0)-(b.actual||0),p.currency)}</td></tr>`).join('')||'<tr><td colspan="6"><p class="muted" style="padding:20px">No budget items yet.</p></td></tr>'}</tbody></table></div>`;
}
async function openBudgetItemForm(projectId){ openModal(`<div class="modal-head"><h3 style="margin:0">Budget item</h3><button class="iconbtn" onclick="closeAllModals()">${icon('close')}</button></div><div class="modal-body"><div class="field"><label>Name *</label><input id="bi-name"/></div><div class="row"><div class="field"><label>Category</label><select id="bi-cat"><option>Design</option><option>Labor</option><option>Materials</option><option>Equipment</option><option>Contractor</option><option>Consultant</option><option>Permit</option><option>Transportation</option><option>Other</option></select></div><div class="field"><label>Estimated</label><input id="bi-est" type="number"/></div></div><div class="row"><div class="field"><label>Committed</label><input id="bi-com" type="number"/></div><div class="field"><label>Actual</label><input id="bi-act" type="number"/></div></div></div><div class="modal-foot"><button class="btn" onclick="closeAllModals()">Cancel</button><button class="btn btn-primary" id="bi-save">Add</button></div>`); $('#bi-save').onclick=async()=>{ const n=$('#bi-name').value.trim(); if(!n){ toast('Name required','err'); return; } await createRecord('budget_items',{projectId,name:n,category:$('#bi-cat').value,estimated:+$('#bi-est').value||0,committed:+$('#bi-com').value||0,actual:+$('#bi-act').value||0},'Budget item'); toast('Budget item added','ok'); closeAllModals(); routeProject(projectId,'budget'); }; }

/* ---------- BOQ / RAB ---------- */
async function renderBOQ(p){ const items=await dbFilter('boq_items',b=>b.projectId===p.id); const tot=items.reduce((s,b)=>s+(b.quantity||0)*(b.unitPrice||0),0); const cats={}; items.forEach(b=>cats[b.category]=(cats[b.category]||0)+(b.quantity||0)*(b.unitPrice||0));
  return header('BOQ / RAB','Bill of quantities & anggaran biaya', (can('internal',p)?`<button class="btn btn-primary" onclick="openBOQItemForm('${p.id}')">${icon('plus',15)} Add item</button>`:''))
  + `<div class="grid g2" style="margin-bottom:16px"><div class="card"><div class="card-body"><div class="mini">Category subtotals</div>${Object.entries(cats).map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px"><span>${esc(k)}</span><b>${fmtMoney(v,p.currency)}</b></div>`).join('')}</div></div><div class="card"><div class="card-body"><div class="mini">Grand total</div><div style="font-size:26px;font-weight:800;letter-spacing:-.02em;margin:6px 0">${fmtMoney(tot,p.currency)}</div><div class="muted" style="font-size:12px">${items.length} line items</div></div></div></div>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Code</th><th>Description</th><th>Category</th><th>Unit</th><th>Qty</th><th>Unit price</th><th>Total</th><th>Status</th></tr></thead><tbody>${items.map(b=>`<tr><td class="mono" style="font-weight:600">${esc(b.code)}</td><td style="max-width:220px">${esc(b.description)}<div class="muted" style="font-size:11px">${esc(b.vendor||'')}</div></td><td>${esc(b.category)}</td><td>${esc(b.unit)}</td><td class="mono">${b.quantity}</td><td class="mono">${fmtMoney(b.unitPrice,p.currency)}</td><td class="mono" style="font-weight:600">${fmtMoney(b.quantity*b.unitPrice,p.currency)}</td><td>${statusBadge(b.status)}</td></tr>`).join('')||'<tr><td colspan="8"><p class="muted" style="padding:20px">No BOQ items.</p></td></tr>'}</tbody></table></div>`;
}

  return header('Discussions','Contextual conversations attached to project entities','<button class="btn btn-primary" onclick="openDiscussionForm(\''+p.id+'\')">'+icon('plus',15)+' New discussion</button>')
  + (discs.length? `<div style="display:flex;flex-direction:column;gap:14px">${discs.map(d=>`<div class="card"><div class="card-head"><div><span class="card-title">${esc(d.title)}</span><div class="muted" style="font-size:11px;font-weight:400">Attached to ${esc(d.attachedType||'Project')} · ${esc(d.attachedId||'')}</div></div></div><div class="card-body discussion" data-disc="${d.id}"></div><div style="display:flex;gap:8px;padding:0 16px 16px"><input placeholder="Reply…" data-reply="${d.id}" style="flex:1"/><button class="btn btn-primary btn-sm" onclick="sendReply('${d.id}')">${icon('send',14)}</button></div></div>`).join('')}</div>`:emptyState('chat','No discussions','Start a discussion to collect feedback on designs, drawings, or issues.','New discussion','openDiscussionForm(\''+p.id+'\')'));

async function renderHandover(p){ const items=await dbFilter('handover_items',h=>h.projectId===p.id); const punches=await dbFilter('punch_list_items',pl=>pl.projectId===p.id); const done=items.filter(i=>i.done).length;
  const baseItems=[
    {item:'Final inspection',category:'Inspection'},{item:'Punch list completed',category:'Construction'},{item:'As-built drawings',category:'Documentation'},{item:'Final specifications',category:'Documentation'},{item:'Warranty documents',category:'Documentation'},{item:'Maintenance documents',category:'Documentation'},{item:'Final invoices',category:'Finance'},{item:'Client approval',category:'Sign-off'},{item:'Handover date',category:'Sign-off'},
  ];
  const all=items.length?items:baseItems.map((b,idx)=>({id:'tmp-ho-'+idx,...b,done:false}));
  return header('Handover','Final project delivery checklist','')
  + `<div class="grid g2">
  <div class="card"><div class="card-head"><span class="card-title">Handover checklist</span><span class="muted">${done}/${all.length}</span></div><div class="card-body">
   ${all.map(h=>`<label style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer"><input type="checkbox" ${h.done?'checked':''} style="width:auto" onchange="toggleHandover('${h.id}','${p.id}',this.checked)"/><span style="font-size:13.5px;${h.done?'text-decoration:line-through;color:var(--text-3)':''}">${esc(h.item)}</span><span class="badge b-neutral" style="margin-left:auto">${esc(h.category)}</span></label>`).join('')}
   ${done===all.length?`<button class="btn btn-primary btn-block" style="margin-top:14px" onclick="completeProject('${p.id}')">${icon('check',16)} Complete project</button>`:''}
  </div></div>
  <div class="card"><div class="card-head"><span class="card-title">Punch list</span><button class="btn btn-sm" onclick="openPunchForm('${p.id}')">${icon('plus',14)} Add</button></div><div class="card-body" style="padding:8px 16px">${punches.length?punches.map(pl=>`<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)"><input type="checkbox" ${pl.status==='Verified'?'checked':''} style="width:auto" onchange="quickPunch('${pl.id}','${p.id}',this.checked)"/><div style="flex:1;min-width:0"><div class="truncate" style="font-size:13px;font-weight:500">${esc(pl.item)}</div><div class="muted" style="font-size:11px">${esc(pl.location||'')} · ${esc(pl.assignedTo||'')}</div></div>${priorityBadge(pl.priority)}</div>`).join(''):'<p class="muted">No punch list items.</p>'}</div></div>
  </div>`;
}

  + `<div class="grid g4" style="margin-bottom:16px">${miniStat('Overall progress',(p.progress||0)+'%','var(--ok)')}${miniStat('Construction',(p.constructionProgress||0)+'%','var(--accent)')}${miniStat('Milestones',miles.filter(m=>m.status==='Completed').length+'/'+miles.length,'')}${miniStat('Pending approvals',approvals.length+'','var(--info)')}</div>
  <div class="grid g2">
   <div class="card"><div class="card-head"><span class="card-title">Project timeline</span></div><div class="card-body"><div class="muted" style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:8px"><span>${fmtDate(p.startDate)}</span><span>${fmtDate(p.targetDate)}</span></div>${progressBar(p.progress||0)}<div class="divider"></div>${miles.slice(0,6).map(m=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border)"><span style="font-size:13px">${esc(m.title)}</span>${statusBadge(m.status)}</div>`).join('')}</div></div>
   <div class="card"><div class="card-head"><span class="card-title">Design options</span></div><div class="card-body">${opts.length?opts.map(o=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)"><span style="font-size:13px;font-weight:500">${esc(o.name)}</span>${statusBadge(o.status)}</div>`).join(''):'<p class="muted">No design options shared yet.</p>'}<div class="divider"></div><textarea id="cp-comment" placeholder="Leave feedback for the team…"></textarea><button class="btn btn-primary" style="margin-top:8px" onclick="clientFeedback('${p.id}')">${icon('send',14)} Send feedback</button></div></div>
  </div>`;
}
window.clientFeedback=async pid=>{ const v=$('#cp-comment').value.trim(); if(!v){ toast('Please write feedback','err'); return; } await createRecord('task_comments',{taskId:'client-feedback-'+pid,userId:state.user.id,userName:state.user.name,text:v},'Feedback'); toast('Feedback sent','ok'); $('#cp-comment').value=''; };

/* ============================================================
   PWA — Service worker + manifest (register via blob)
   ============================================================ */
function injectManifest(){ const m={name:'ARQORA',short_name:'ARQORA',description:'Architecture Project Operating System. From concept to construction. One connected workspace.',start_url:'.',display:'standalone',background_color:'#0f1115',theme_color:'#c8552b',icons:[{src:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#c8552b"/><path d="M50 20 L78 78 L22 78 Z" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round"/></svg>'),sizes:'any',type:'image/svg+xml',purpose:'any'}]};
  const link=$('#manifestlink'); if(link){ link.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(m)); } }
let installPromptEvt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installPromptEvt=e; });
window.addEventListener('appinstalled',()=>{ installPromptEvt=null; toast('ARQORA installed','ok'); });
async function registerSW(){ if(!('serviceWorker' in navigator)) return; try{ const swCode=`
self.addEventListener('install',e=>{ self.skipWaiting(); e.waitUntil(caches.open('arqora-v1').then(c=>c.addAll(['./'])).catch(()=>{})); });
self.addEventListener('activate',e=>{ e.waitUntil(self.clients.claim()); });
self.addEventListener('fetch',e=>{
  if(e.request.method!=='GET') return;
  e.respondWith(
    caches.match(e.request).then(r=>{
      return r || fetch(e.request).then(res=>{ const cl=res.clone(); caches.open('arqora-v1').then(c=>c.put(e.request,cl)); return res; }).catch(()=>caches.match('./'));
    })
  );
});`;
  const blob=new Blob([swCode],{type:'text/javascript'}); const url=URL.createObjectURL(blob);
  // Service workers must be same-origin files; blob URLs aren't allowed,
  // so for the single-file build we provide a graceful fallback — the app
  // remains fully functional offline via IndexedDB regardless.
  try{ await navigator.serviceWorker.register(url); }catch(e){ /* fallback silent */ }
  }catch(e){}
}

/* ============================================================
   INIT
   ============================================================ */
async function main(){ initTheme(); injectManifest(); await openDB(); await bootAuth();
  // migrate legacy fields
  const projects=await dbAll('projects'); for(const p of projects){ if(!p.clientName){ const cl=p.clientId?await dbGet('clients',p.clientId):null; if(cl) await dbPut('projects',{...p,clientName:cl.name,clientCompany:cl.company}); } if(!p.members) await dbPut('projects',{...p,members:[{userId:p.pmId||state.user?.id,role:'Owner'}]}); }
  await updatePending();
  window.addEventListener('online',()=>{ state.online=true; syncUI(); flushSync(); toast('Back online — syncing changes','ok'); });
  window.addEventListener('offline',()=>{ state.online=false; syncUI(); toast('You are offline — changes saved locally','warn'); });
  window.addEventListener('hashchange',()=>{ if(stripHash(location.hash)!==state.currentHash){ state.currentHash=stripHash(location.hash); renderFull(); } });
  state.currentHash=stripHash(location.hash);
  registerSW();
  renderFull();
}
