<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0f1115" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ARQORA" />
<meta name="description" content="ARQORA — Architecture Project Operating System. From concept to construction. One connected workspace." />
<title>ARQORA — Architecture Project Operating System</title>
<link id="manifestlink" rel="manifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#f7f7f5; --surface:#ffffff; --surface-2:#f1f1ee; --border:#e6e6e1; --border-2:#d9d9d3;
  --text:#17181a; --text-2:#595c63; --text-3:#8a8d94; --accent:#c8552b; --accent-soft:#f7e7e0;
  --accent-text:#b54421; --ok:#2f7d4f; --ok-soft:#e3f1e8; --warn:#b07a1a; --warn-soft:#f7eed7;
  --danger:#c0392b; --danger-soft:#f8e4e1; --info:#2b62a0; --info-soft:#e2ecf7; --neutral:#6b6e75;
  --shadow:0 1px 2px rgba(20,20,20,.05),0 4px 16px rgba(20,20,20,.05);
  --shadow-lg:0 8px 40px rgba(20,20,20,.14);
  --radius:10px; --radius-sm:7px; --radius-lg:14px;
  --font:'Inter',system-ui,-apple-system,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
[data-theme="dark"]{
  --bg:#0e0f12; --surface:#15171a; --surface-2:#1c1e23; --border:#26282e; --border-2:#33363d;
  --text:#eceef1; --text-2:#a6aab2; --text-3:#6e727b; --accent:#e06a3a; --accent-soft:#3a2620;
  --accent-text:#ef8a5f; --ok:#4dbb76; --ok-soft:#18261d; --warn:#d9a63f; --warn-soft:#2b2414;
  --danger:#e2776a; --danger-soft:#311f1d; --info:#6da1d9; --info-soft:#1b2530; --neutral:#8a8e96;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.4);
  --shadow-lg:0 8px 40px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
#app{min-height:100dvh}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius-sm);padding:9px 11px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label{font-size:12px;font-weight:600;color:var(--text-2);display:block;margin-bottom:5px;letter-spacing:.01em}
textarea{resize:vertical;min-height:80px}
::selection{background:var(--accent);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.mono{font-family:var(--mono)}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* Layout */
.shell{display:flex;min-height:100dvh}
.sidebar{width:252px;background:var(--surface);border-right:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:40}
.main{flex:1;margin-left:252px;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 20px;height:56px}
.content{padding:24px 28px 120px;max-width:1180px;width:100%;margin:0 auto}
.mobilenav{display:none}
@media(max-width:900px){
  .sidebar{display:none}
  .main{margin-left:0}
  .content{padding:16px 14px 110px}
  .topbar{padding:0 12px;height:52px}
  .mobilenav{display:flex}
}
.quickfab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:45;display:none}
@media(max-width:900px){.quickfab{display:block}}
@media(min-width:901px){.quickfab{display:none}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border-2);background:var(--surface);color:var(--text);padding:8px 13px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;transition:.14s;white-space:nowrap}
.btn:hover{border-color:var(--text-3);background:var(--surface-2)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-text);border-color:var(--accent-text)}
.btn-danger{background:var(--danger-soft);border-color:var(--danger-soft);color:var(--danger)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{border-color:transparent;background:var(--surface-2)}
.btn-sm{padding:5px 9px;font-size:12px}
.btn-lg{padding:11px 18px;font-size:14px;border-radius:var(--radius)}
.btn-block{width:100%}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text-2);flex-shrink:0}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}
.iconbtn.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-body{padding:16px}
.card-title{font-size:14px;font-weight:700;letter-spacing:-.01em}

/* Badges / status */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;border:1px solid var(--border-2);color:var(--text-2);line-height:1.6;white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent);background:var(--ok-soft)}
.b-warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,transparent);background:var(--warn-soft)}
.b-danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 30%,transparent);background:var(--danger-soft)}
.b-info{color:var(--info);border-color:color-mix(in srgb,var(--info) 30%,transparent);background:var(--info-soft)}
.b-accent{color:var(--accent-text);border-color:color-mix(in srgb,var(--accent) 30%,transparent);background:var(--accent-soft)}
.b-neutral{color:var(--text-2);background:var(--surface-2)}
.b-solid-ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.b-solid-warn{background:var(--warn);color:#fff;border-color:var(--warn)}
.b-solid-danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.b-solid-accent{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Nav */
.nav-item{display:flex;align-items:center;gap:11px;padding:8px 11px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:500;color:var(--text-2);width:100%;text-align:left;border:none;background:transparent;transition:.12s}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--surface-2);color:var(--text);font-weight:600}
.nav-item svg{flex-shrink:0;width:17px;height:17px}
.nav-item .cnt{margin-left:auto;font-size:11px;color:var(--text-3);background:var(--surface-2);padding:1px 7px;border-radius:10px}
.mobnav{position:fixed;bottom:0;left:0;right:0;height:64px;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.mobnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:500;color:var(--text-3);background:none;border:none}
.mobnav button.active{color:var(--accent)}
.mobnav button svg{width:22px;height:22px}
.mobnav .mobadd{width:46px;height:46px;background:var(--accent);color:#fff;border-radius:50%;align-self:center;display:flex;align-items:center;justify-content:center;margin-top:-28px;box-shadow:var(--shadow-lg);border:none}

/* Tables */
.tbl-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface)}
table.tbl th{text-align:left;padding:10px 14px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-3);border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface)}
table.tbl td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tbody tr:hover{background:var(--surface-2)}
table.tbl a.rlink{color:var(--text);font-weight:500}
table.tbl a.rlink:hover{color:var(--accent)}

/* Forms */
.field{margin-bottom:14px}
.row{display:flex;gap:14px}
.row>*{flex:1}
.help{font-size:12px;color:var(--text-3);margin-top:4px}
.err{font-size:12px;color:var(--danger);margin-top:4px}

/* Progress */
.prog{height:7px;background:var(--surface-2);border-radius:10px;overflow:hidden}
.prog>div{height:100%;background:var(--accent);border-radius:10px;transition:width .4s}
.prog.p-ok>div{background:var(--ok)}
.prog.p-warn>div{background:var(--warn)}
.prog.p-danger>div{background:var(--danger)}

/* Toasts */
.toasts{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;width:calc(100% - 32px);max-width:420px;pointer-events:none}
@media(min-width:901px){.toasts{bottom:24px}}
.toast{background:var(--text);color:var(--bg);padding:11px 16px;border-radius:var(--radius);font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:9px;animation:tlidein .2s ease;max-width:100%}
.toast.ok{background:var(--ok);color:#fff}
.toast.err{background:var(--danger);color:#fff}
.toast.warn{background:var(--warn);color:#fff}
@keyframes tlidein{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* Modal */
.modal-back{position:fixed;inset:0;background:rgba(10,10,12,.5);z-index:90;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@media(min-width:640px){.modal-back{align-items:center;padding:24px}}
.modal{background:var(--surface);border-radius:var(--radius-lg) var(--radius-lg) 0 0;width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:up .22s ease}
@media(min-width:640px){.modal{border-radius:var(--radius-lg)}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2}
.modal-body{padding:20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:var(--surface)}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* Skeleton */
.skel{background:linear-gradient(90deg,var(--surface-2) 25%,var(--border) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:6px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Misc */
.avatar{width:28px;height:28px;border-radius:50%;background:var(--surface-2);color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;border:1px solid var(--border)}
.avatar.lg{width:40px;height:40px;font-size:14px}
.divider{height:1px;background:var(--border);margin:14px 0}
.muted{color:var(--text-3);font-size:12px}
.pillfield{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;background:var(--surface-2);font-size:12px;font-weight:500;border:1px solid var(--border)}
.chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
@media(max-width:500px){.row{flex-direction:column;gap:0}}
.kpi{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1}
.phbar{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden}
.phbar span{flex:1;background:var(--surface-2)}
.phbar span.on{background:var(--accent)}
.phbar span.done{background:var(--ok)}
.phbar span.risk{background:var(--danger)}
.lifecycle{display:flex;overflow-x:auto;gap:0;padding:4px 0;scrollbar-width:none}
.lifecycle::-webkit-scrollbar{display:none}
.lcstep{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;color:var(--text-3);white-space:nowrap;border:1px solid transparent}
.lcstep .dot{width:7px;height:7px;border-radius:50%;background:var(--border-2)}
.lcstep.done{color:var(--ok)}
.lcstep.done .dot{background:var(--ok)}
.lcstep.cur{color:var(--accent-text);background:var(--accent-soft)}
.lcstep.cur .dot{background:var(--accent)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;margin-bottom:18px}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 14px;font-size:13px;font-weight:500;color:var(--text-3);border:none;background:none;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--text);border-color:var(--accent);font-weight:600}
.tab .cnt{font-size:11px;background:var(--surface-2);padding:0 6px;border-radius:8px;margin-left:5px}
.cmd-back{position:fixed;inset:0;background:rgba(10,10,12,.55);z-index:95;backdrop-filter:blur(2px);animation:fade .12s;display:flex;justify-content:center;padding-top:10vh}
.cmd{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);width:600px;max-width:calc(100% - 32px);height:fit-content;max-height:60vh;overflow:hidden;box-shadow:var(--shadow-lg)}
.cmd input{border:none;border-bottom:1px solid var(--border);font-size:16px;padding:16px 18px;border-radius:0}
.cmd-res{max-height:46vh;overflow-y:auto}
.cmd-item{display:flex;align-items:center;gap:12px;padding:11px 18px;cursor:pointer;border:none;background:none;width:100%;text-align:left;font-size:13px;color:var(--text)}
.cmd-item:hover,.cmd-item.sel{background:var(--surface-2)}
.cmd-item .kbd{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text-3)}
.empty{text-align:center;padding:40px 20px;color:var(--text-3)}
.empty svg{margin:0 auto 12px;color:var(--text-3);opacity:.6}
.empty h3{color:var(--text-2);font-size:15px;margin:0 0 4px}
.empty p{font-size:13px;margin:0 0 16px;max-width:360px;margin-left:auto;margin-right:auto}
.syncbar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface)}
.syncbar .sd{width:8px;height:8px;border-radius:50%}
.syncbar.online .sd{background:var(--ok)}
.syncbar.offline .sd{background:var(--text-3)}
.syncbar.syncing .sd{background:var(--warn);animation:blink 1s infinite}
.syncbar.error .sd{background:var(--danger)}
@keyframes blink{50%{opacity:.3}}
.banner{padding:10px 16px;font-size:12.5px;font-weight:500;border-radius:var(--radius);display:flex;align-items:center;gap:10px;margin-bottom:18px}
.banner.offline{background:var(--danger-soft);color:var(--danger)}
.menu-item{display:flex;align-items:center;gap:10px;padding:9px 12px;font-size:13px;color:var(--text);width:100%;text-align:left;border:none;background:none;border-radius:var(--radius-sm)}
.menu-item:hover{background:var(--surface-2)}
.menu-item.danger{color:var(--danger)}
.km{border:1px solid var(--border-2);border-bottom:3px solid var(--border-2);border-radius:5px;padding:0 6px;font-family:var(--mono);font-size:11px}
.swipe{overflow-x:auto;display:flex;gap:12px;padding-bottom:4px;scroll-snap-type:x mandatory}
.swipe>*{scroll-snap-align:start;flex-shrink:0}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.mini{font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;color:var(--text-3)}
.section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);margin:24px 0 10px}
.clickable{cursor:pointer}
span.mention{color:var(--accent-text);font-weight:600}
.thumb{width:100%;height:120px;object-fit:cover;border-radius:var(--radius-sm);background:var(--surface-2)}
.imggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.offline-pill{position:fixed;top:0;left:0;right:0;background:var(--danger);color:#fff;text-align:center;font-size:12px;font-weight:600;padding:4px;z-index:120;display:none}
body.offline .offline-pill{display:block}
</style>
</head>
<body>
<div class="offline-pill">Offline mode — changes saved locally and will sync when you reconnect</div>
<div id="app"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
/* ============================================================
   ARQORA — Architecture Project Operating System
   Single-file offline-first PWA (MVP)
   ============================================================ */
'use strict';

/* ---------- Utilities ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowISO=()=>new Date().toISOString();
const now=()=>Date.now();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fmtDate=(iso,opt)=>{ if(!iso) return '—'; const d=new Date(iso); if(isNaN(d)) return '—'; return d.toLocaleDateString(undefined,opt||{month:'short',day:'numeric',year:'numeric'}); };
const fmtDateNum=iso=>{ if(!iso) return '—'; const d=new Date(iso); if(isNaN(d)) return '—'; return d.toLocaleDateString(undefined,{year:'numeric',month:'2-digit',day:'2-digit'}); };
const fmtDateTime=iso=>{ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); };
const timeAgo=iso=>{ if(!iso) return ''; const s=(now()-new Date(iso).getTime())/1000; if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+'m ago'; if(s<86400) return Math.floor(s/3600)+'h ago'; if(s<86400*30) return Math.floor(s/86400)+'d ago'; return fmtDate(iso); };
const relDays=iso=>{ if(!iso) return null; return Math.ceil((new Date(iso).getTime()-now())/(86400000)); };
const fmtMoney=(n,cur)=>{ if(n==null||isNaN(n)) return '—'; const c=cur||'USD'; try{ return new Intl.NumberFormat(undefined,{style:'currency',currency:c,maximumFractionDigits:0}).format(n);}catch(e){ return c+' '+Math.round(n).toLocaleString(); } };
const pct=(a,b)=> b? Math.round((a/b)*100) : 0;
const initials=name=> (name||'?').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const stripHash=h=> h.replace(/^#/,'');
function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }

/* ---------- Icons (consistent line icon set, no emoji) ---------- */
const ICONS={

/* ---------- IndexedDB wrapper ---------- */
const DB_NAME='arqora-db';
const DB_VERSION=1;
const TABLES=['users','workspaces','workspace_members','clients','projects','project_members','project_phases','milestones','tasks','task_comments','task_checklists','design_options','drawings','drawing_revisions','documents','document_versions','budget_items','boq_items','construction_updates','site_diaries','site_photos','issues','rfis','inspections','materials','change_orders','approvals','discussions','discussion_messages','notifications','audit_logs','handover_items','punch_list_items','sync_queue','kv'];
let db=null;
function openDB(){ return new Promise((res,rej)=>{ if(db) return res(db); const req=indexedDB.open(DB_NAME,DB_VERSION); req.onupgradeneeded=e=>{ const d=e.target.result; TABLES.forEach(t=>{ if(!d.objectStoreNames.contains(t)) d.createObjectStore(t,{keyPath:'id'}); }); ['projectId','entityId','entityType','project_id','discussionId','parentId','taskId','drawingId','documentId','workspaceId','status','createdAt'].forEach(f=>{ try{ ['tasks','site_diaries','site_photos','issues','rfis','inspections','materials','change_orders','approvals','drawings','documents','discussions','discussion_messages','notifications','project_members','budget_items','boq_items','milestones','construction_updates','documents','design_options','handover_items','punch_list_items','audit_logs','sync_queue','task_comments'].forEach(t=>{ if(!d.objectStoreNames.contains(t)) return; try{d.transaction.objectStore(t).createIndex('by_'+f,f)}catch(_){} }); }catch(_){} }); }; req.onsuccess=e=>{ db=e.target.result; res(db); }; req.onerror=()=>rej(req.error); }); }
async function dbAll(store,index,key){ const d=await openDB(); return new Promise((res)=>{ const tx=d.transaction(store,'readonly'); const os=tx.objectStore(store); let req = (index&&key!=null)? os.index(index).getAll(key) : os.getAll(); req.onsuccess=()=>res(req.result||[]); req.onerror=()=>res([]); }); }
async function dbGet(store,id){ const d=await openDB(); return new Promise(res=>{ const tx=d.transaction(store,'readonly'); const r=tx.objectStore(store).get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); }); }
async function dbPut(store,obj){ const d=await openDB(); return new Promise((res,rej)=>{ const tx=d.transaction(store,'readwrite'); tx.objectStore(store).put(obj); tx.oncomplete=()=>res(obj); tx.onerror=()=>rej(tx.error); }); }
async function dbBulk(store,arr){ const d=await openDB(); return new Promise((res,rej)=>{ const tx=d.transaction(store,'readwrite'); const os=tx.objectStore(store); arr.forEach(o=>os.put(o)); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function dbDel(store,id){ const d=await openDB(); return new Promise((res,rej)=>{ const tx=d.transaction(store,'readwrite'); tx.objectStore(store).delete(id); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function dbClear(store){ const d=await openDB(); return new Promise(res=>{ const tx=d.transaction(store,'readwrite'); tx.objectStore(store).clear(); tx.oncomplete=()=>res(); }); }
async function dbFind(store,pred){ const all=await dbAll(store); return all.find(pred)||null; }
async function dbFilter(store,pred){ const all=await dbAll(store); return all.filter(pred); }

/* ---------- Reactive store ---------- */
const state={
  user:null, workspace:null, project:null, route:'/', 
  online:navigator.onLine, syncStatus:'idle', pendingSync:0,
  searchOpen:false, cmdOpen:false, siteMode:false,
  mobileNavOpen:false, notificationsOpen:false,
  notifyCount:0,
};
let version=0;
const listeners=new Set();
function setState(patch){ Object.assign(state,patch); version++; notify(); }
function subscribe(fn){ listeners.add(fn); return ()=>listeners.delete(fn); }
function notify(){ listeners.forEach(f=>f()); }
function refresh(){ version++; notify(); }

/* ---------- Persistence of user/session (localStorage for session pointer) ---------- */
const LS_KEY='arqora_session';
function getSession(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||'null'); }catch(e){ return null; } }
function setSession(s){ try{ localStorage.setItem(LS_KEY,JSON.stringify(s)); }catch(e){} }
function clearSession(){ setSession(null); }

async function hashPW(str){ const data=new TextEncoder().encode(str); const buf=await crypto.subtle.digest('SHA-256',data); return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join(''); }

/* ---------- Sync engine ---------- */
async function enqueue(entityType,action,payload,entityId){ const rec={id:uid(),entityType,entityId:entityId||payload?.id||null,action,payload,createdAt:nowISO(),retryCount:0,status:'pending'}; await dbPut('sync_queue',rec); updatePending(); }
async function updatePending(){ const q=await dbAll('sync_queue'); const n=q.filter(r=>r.status==='pending'||r.status==='failed').length; if(state.pendingSync!==n){ state.pendingSync=n; notify(); } }
async function flushSync(){ if(!state.online || state.syncStatus==='syncing') return; const q=await dbAll('sync_queue'); const pending=q.filter(r=>r.status!=='synced'&&r.status!=='conflict'); if(!pending.length){ setState({syncStatus:'idle'}); return; } setState({syncStatus:'syncing'}); notify(); try{ for(const rec of pending){ rec.status='syncing'; await dbPut('sync_queue',rec); /* In a real deployment this would POST to the cloud API. Local adapter: mark synced after simulated network round-trip. */ await sleep(120); rec.status='synced'; rec.syncedAt=nowISO(); await dbPut('sync_queue',rec); await logAudit('sync',rec.action,rec.entityType,null,null); } await saveKV('lastSync',nowISO()); setState({syncStatus:'idle'}); toast('All changes synced to the cloud','ok'); }catch(e){ setState({syncStatus:'error'}); toast('Sync failed — '+(e.message||'network error'),'err'); } updatePendingTree(); }
async function saveKV(k,v){ await dbPut('kv',{id:k,value:v}); }
async function getKV(k){ const r=await dbGet('kv',k); return r?r.value:null; }

/* ---------- Audit log ---------- */
async function logAudit(action,entity,prev,next,projectId){ const rec={id:uid(),userId:state.user?.id,userName:state.user?.name||'System',action,entity,prevValue:prev,newValue:next,projectId:projectId||state.project?.id,timestamp:nowISO(),createdAt:nowISO()}; await dbPut('audit_logs',rec); }
async function notifyUser(userId,type,title,body,projectId,entityId){ const n={id:uid(),userId,type,title,body,projectId,entityId,read:false,createdAt:nowISO()}; await dbPut('notifications',n); }

/* ---------- Toast ---------- */
function toast(msg,type){ const c=$('#toasts'); const t=document.createElement('div'); t.className='toast '+(type||''); t.innerHTML=(type==='ok'?icon('check'):type==='err'?icon('warn'):icon('bell'))+`<span>${esc(msg)}</span>`; c.appendChild(t); setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); },3200); }

/* ---------- Modal system ---------- */
let modalStack=[];
function openModal(html,opts){ opts=opts||{}; const m=document.createElement('div'); m.className='modal-back'; m.innerHTML=`<div class="modal" role="dialog" aria-modal="true" style="max-width:${opts.w||560}px">${html}</div>`; m.addEventListener('click',e=>{ if(e.target===m && !opts.lock) closeModal(m); }); document.body.appendChild(m); const focus=$('input,select,textarea',m); if(focus) setTimeout(()=>focus.focus(),50); modalStack.push(m); return m; }
function closeModal(m){ if(!m){ if(modalStack.length) m=modalStack.pop(); else return; } m.style.opacity='0'; m.style.transition='opacity .15s'; setTimeout(()=>m.remove(),150); }
function closeAllModals(){ [...modalStack].forEach(m=>m.remove()); modalStack=[]; }
function confirmDialog(title,body,confirmLabel,danger,onConfirm){ openModal(`<div class="modal-head"><h3 style="margin:0;font-size:15px">${esc(title)}</h3><button class="iconbtn" onclick="closeAllModals()">${icon('close')}</button></div><div class="modal-body"><p style="color:var(--text-2);margin:0;line-height:1.6">${body}</p></div><div class="modal-foot"><button class="btn" onclick="closeAllModals()">Cancel</button><button class="btn ${danger?'btn-danger':'btn-primary'}" id="cfm-yes">${esc(confirmLabel)}</button></div>`,{lock:true,w:440}); $('#cfm-yes').onclick=()=>{ closeAllModals(); onConfirm(); }; }

/* ---------- CRUD helpers with sync ---------- */
async function createRecord(table,rec,entType,label,opts){ opts=opts||{}; const obj={createdAt:nowISO(),updatedAt:nowISO(),...(opts.noTs?{}:{createdBy:state.user?.id,createdByName:state.user?.name}),...rec,id:rec.id||uid()}; await dbPut(table,obj); await enqueue(entType||table,'create',obj,obj.id); await logAudit('create',label||table,null,obj.id,obj.projectId||obj.project_id); return obj; }
async function updateRecord(table,id,patch,label,entType){ const existing=await dbGet(table,id); if(!existing) return null; const merged={...existing,...patch,updatedAt:nowISO()}; await dbPut(table,merged); await enqueue(entType||table,'update',merged,id); await logAudit('update',label||table,existing,merged,merged.projectId||merged.project_id); return merged; }
async function deleteRecord(table,id,label){ const existing=await dbGet(table,id); await dbDel(table,id); await enqueue(table,'delete',existing,id); await logAudit('delete',label||table,existing,null); }

async function bootAuth(){ const s=getSession(); if(s && s.userId){ const u=await dbGet('users',s.userId); if(u){ state.user=u; state.workspace=await dbGet('workspaces',s.workspaceId); return true; } clearSession(); } const guestId='guest-user'; const workspaceId='guest-workspace'; let u=await dbGet('users',guestId); if(!u){ u={id:guestId,name:'ARQORA Guest',email:'guest@arqora.local',passwordHash:'',avatarColor:'#c8552b',workspaceId}; await dbPut('users',u); } else if(!u.workspaceId){ u={...u,workspaceId}; await dbPut('users',u); } let ws=await dbGet('workspaces',workspaceId); if(!ws){ ws={id:workspaceId,name:'Studio Arqora',logo:'A',currency:'IDR',timezone:'Asia/Jakarta',dateFormat:'MM/DD/YYYY',role:'Owner',createdAt:nowISO(),updatedAt:nowISO()}; await dbPut('workspaces',ws); await dbPut('workspace_members',{id:'guest-member',workspaceId,userId:guestId,role:'Owner'}); } state.user=u; state.workspace=ws; const projects=await dbFilter('projects',p=>p.workspaceId===workspaceId); if(!projects.length) await seedDemo(workspaceId,guestId,u.name); return true; }
async function registerUser(name,email,password){ if(await dbFind('users',u=>u.email===email.toLowerCase())) throw new Error('An account with this email already exists.'); const u={id:uid(),name,email:email.toLowerCase(),passwordHash:await hashPW(password),avatarColor:pickColor(name),createdAt:nowISO(),updatedAt:nowISO(),theme:'system'}; await dbPut('users',u); setSession({userId:u.id}); await saveKV('lastUserId',u.id); state.user=u; return u; }
async function loginUser(email,password){ const u=await dbFind('users',x=>x.email===email.toLowerCase()); if(!u) throw new Error('No account found with this email.'); const h=await hashPW(password); if(u.passwordHash!==h) throw new Error('Incorrect password.'); setSession({userId:u.id,workspaceId:u.workspaceId}); saveKV('lastUserId',u.id); state.user=u; state.workspace=u.workspaceId? await dbGet('workspaces',u.workspaceId):null; return u; }
async function signOut(){ clearSession(); state.user=null; state.workspace=null; state.project=null; location.hash='#/login'; renderFull(); }
function pickColor(name){ const cs=['#c8552b','#2b62a0','#2f7d4f','#7a5aa8','#b07a1a','#9a4b6b','#3b7f8a','#8a6d3b']; let h=0; for(const c of name) h=(h*31+c.charCodeAt(0))%cs.length; return cs[h]; }

function myRole(project){ if(!project||!state.user) return null; const m=project.members?.find(x=>x.userId===state.user.id); return m? m.role : null; }
function isOwner(){ return state.workspace && state.workspace.role==='Owner'; }
function can(perm,project){ const role=myRole(project); if(!project || role==='Owner' || role==='Architect' || role==='Project Manager') return true; const map={
  design:['Designer'], site:['Site Manager'], construction:['Site Manager','Contractor'],
  tasks:['Contractor','Site Manager'], view:['Client','Contractor','Designer','Consultant','Site Manager'],
  internal:['Designer','Site Manager','Contractor','Consultant'],
}; if(perm==='view') return !!role; if(perm==='internal') return map.internal.includes(role); return map[perm]?.includes(role)||false; }
function isClient(project){ return myRole(project)==='Client'; }

function addDays(base,days){ const d=base instanceof Date?base:new Date(base); if(isNaN(d.getTime())) return base; d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }

function renderAuth(mode){ const app=$('#app'); const isLogin=mode==='login'; const isReset=mode==='reset'; const isForgot=mode==='forgot';
  app.innerHTML=`<div style="min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)">
    <div style="width:100%;max-width:400px">
      <div style="text-align:center;margin-bottom:32px">
        <div style="width:52px;height:52px;margin:0 auto 14px;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center">${icon('logo',28)}</div>
        <h1 style="font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0">ARQORA</h1>
        <p style="color:var(--text-3);font-size:13px;margin:4px 0 0">Architecture Project Operating System</p>
      </div>
      <div class="card" style="border-radius:var(--radius-lg)">
        <div class="card-body" style="padding:26px">
          ${isLogin?`<h2 style="margin:0 0 4px;font-size:17px">Welcome back</h2><p style="color:var(--text-3);margin:0 0 20px;font-size:13px">Sign in to your workspace.</p>`
          :isForgot?`<h2 style="margin:0 0 4px;font-size:17px">Reset password</h2><p style="color:var(--text-3);margin:0 0 20px;font-size:13px">Enter your email to receive a reset link.</p>`
          :isReset?`<h2 style="margin:0 0 4px;font-size:17px">Set new password</h2><p style="color:var(--text-3);margin:0 0 20px;font-size:13px">Choose a new password for your account.</p>`
          :`<h2 style="margin:0 0 4px;font-size:17px">Create your account</h2><p style="color:var(--text-3);margin:0 0 20px;font-size:13px">Start managing architecture projects with ARQORA.</p>`}
          <form id="authform">
            ${!isLogin&&!isForgot&&!isReset?`<div class="field"><label>Full name</label><input name="name" required placeholder="Alex Morgan"/></div>`:''}
            ${!isReset?`<div class="field"><label>Email</label><input name="email" type="email" required placeholder="you@studio.com"/></div>`:''}
            ${!isForgot?`<div class="field"><label>${isReset?'New password':'Password'}</label><input name="password" type="password" required minlength="6" placeholder="••••••••"/></div>`:''}
            <div id="autherr" class="err" style="margin-bottom:12px"></div>
            <button class="btn btn-primary btn-lg btn-block" type="submit" id="authbtn">${isLogin?'Sign in':isForgot?'Send reset link':isReset?'Update password':'Create account'}</button>
          </form>
          ${isLogin?`<div style="text-align:center;margin-top:16px;font-size:13px;color:var(--text-3)">
            <a href="#/forgot" onclick="event.preventDefault()" data-nav="forgot" style="color:var(--info)">Forgot password?</a>
          </div>`:''}
        </div>
      </div>
      <p style="text-align:center;font-size:13px;margin-top:20px;color:var(--text-3)">
        ${isLogin?'No account? ':'Have an account? '}
        <a href="javascript:void(0)" data-nav="${isLogin?'signup':'login'}" style="color:var(--accent-text);font-weight:600">${isLogin?'Sign up':'Sign in'}</a>
      </p>
      <p style="text-align:center;font-size:12px;color:var(--text-3);margin-top:24px">From concept to construction. One connected workspace.</p>
    </div>
  </div>`;
  $('a[data-nav]',app).onclick=e=>{ const to=e.currentTarget.getAttribute('data-nav'); if(to==='forgot') location.hash='#/forgot'; else if(to==='signup') location.hash='#/signup'; else location.hash='#/login'; renderAuth(to==='forgot'?'forgot':to); };
  $('#authform').onsubmit=async e=>{ e.preventDefault(); const f=e.target; const btn=$('#authbtn'); const errp=$('#autherr'); errp.textContent=''; btn.disabled=true; btn.textContent='Please wait…';
    try{
      if(mode==='signup'){ const u=await registerUser(f.name.value.trim(),f.email.value.trim(),f.password.value); if(!u.workspaceId){ location.hash='#/onboarding'; renderOnboarding(); } else { location.hash='#/dashboard'; await loadApp(); } }
      else if(mode==='login'){ await loginUser(f.email.value.trim(),f.password.value); await loadApp(); }
      else if(mode==='forgot'){ toast('If an account exists, a reset link has been sent.','ok'); btn.disabled=false; btn.textContent='Send reset link'; }
      else if(mode==='reset'){ const lastUserId=await getKV('lastUserId'); const u=await dbFind('users',x=>x.id===lastUserId); if(u){ u.passwordHash=await hashPW(f.password.value.trim()); await dbPut('users',u); } toast('Password updated.','ok'); location.hash='#/login'; renderAuth('login'); }
    }catch(err){ errp.textContent=err.message; btn.disabled=false; btn.textContent=mode==='login'?'Sign in':mode==='signup'?'Create account':mode==='forgot'?'Send reset link':'Update password'; }
  };
}

const NAV=[{r:'/dashboard',i:'grid',l:'Dashboard'},{r:'/projects',i:'folder',l:'Projects'},{r:'/calendar',i:'cal',l:'Calendar'},{r:'/tasks',i:'check',l:'Tasks'},{r:'/documents',i:'doc',l:'Documents'},{r:'/team',i:'users',l:'Team'},{r:'/reports',i:'chart',l:'Reports'},{r:'/settings',i:'gear',l:'Settings'}];
const PROJNAV=[{r:'overview',i:'grid',l:'Overview'},{r:'brief',i:'brief',l:'Brief'},{r:'planning',i:'timeline',l:'Planning'},{r:'design',i:'draw',l:'Design'},{r:'drawings',i:'draw',l:'Drawings'},{r:'documents',i:'doc',l:'Documents'},{r:'tasks',i:'check',l:'Tasks'},{r:'schedule',i:'cal',l:'Schedule'},{r:'budget',i:'dollar',l:'Budget'},{r:'boq',i:'list',l:'BOQ / RAB'},{r:'construction',i:'crane',l:'Construction'},{r:'site-diary',i:'book',l:'Site Diary'},{r:'photos',i:'photo',l:'Photos'},{r:'issues',i:'warn',l:'Issues'},{r:'rfis',i:'q',l:'RFIs'},{r:'materials',i:'box',l:'Materials'},{r:'inspections',i:'clipboard',l:'Inspections'},{r:'change-orders',i:'swap',l:'Change Orders'},{r:'approvals',i:'stamp',l:'Approvals'},{r:'discussions',i:'chat',l:'Discussions'},{r:'reports',i:'chart',l:'Reports'},{r:'handover',i:'key',l:'Handover'},{r:'archive',i:'archive',l:'Archive'}];

async function loadApp(){ const authed=await bootAuth(); if(!authed) return; captureProjectFromRoute(); await updatePending(); syncUI(); renderFull(); }
function syncUI(){ $$('.syncbar').forEach(el=>{ el.className='syncbar '+(state.syncStatus==='syncing'?'syncing':state.syncStatus==='error'?'error':state.online?'online':'offline'); el.innerHTML=`<span class="sd"></span><span class="synclabel">${state.syncStatus==='syncing'?'Syncing…':state.syncStatus==='error'?'Sync error':state.online?'Online':('Offline')}</span>${state.pendingSync?`<span style="color:var(--text-3)">· ${state.pendingSync}</span>`:''}`; el.onclick=openSyncPanel; }); if(state.user){ $$('.avatar-chip').forEach(a=>{ a.style.background=state.user.avatarColor; a.textContent=initials(state.user.name); }); } }
function openSyncPanel(){ const q=[]; openModal(`<div class="modal-head"><h3 style="margin:0;font-size:15px">Sync status</h3><button class="iconbtn" onclick="closeAllModals()">${icon('close')}</button></div>
<div class="modal-body" id="syncbody">
<div class="syncbar ${state.online?'online':'offline'}" style="margin-bottom:16px"><span class="sd"></span><span>${state.online?'Online':'Offline'}</span></div>
<div class="grid g2" style="margin-bottom:16px">
 <div class="card"><div class="card-body"><div class="mini">Pending changes</div><div style="font-size:20px;font-weight:700">${state.pendingSync}</div></div></div>
 <div class="card"><div class="card-body"><div class="mini">Last sync</div><div style="font-size:15px;font-weight:600">${state.lastSync?fmtDateTime(state.lastSync):'Never'}</div></div></div>
</div>
<div id="syncfail"></div>
</div>
<div class="modal-foot"><button class="btn" onclick="closeAllModals()">Close</button><button class="btn btn-primary" onclick="flushSync();openSyncPanel()">${icon('wifi',16)} Sync now</button></div>`); refreshSyncPanel(); }
async function refreshSyncPanel(){ if(!$('#syncbody')) return; const q=await dbAll('sync_queue'); const failed=q.filter(r=>r.status==='failed'); const el=$('#syncfail'); if(failed.length){ el.innerHTML='<div class="mini" style="margin-bottom:8px">Failed items</div>'+failed.map(f=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--border);font-size:13px"><span>${esc(f.entityType)} (${esc(f.action)})</span><button class="btn btn-sm" onclick="retryOne('${f.id}')">Retry</button></div>`).join(''); } else el.innerHTML='<p class="muted" style="margin:0">No failed items.</p>'; }
window.retryOne=async id=>{ const r=await dbGet('sync_queue',id); if(r){ r.status='pending'; r.retryCount=0; await dbPut('sync_queue',r); flushSync(); toast('Queued for retry','ok'); } };

function captureProjectFromRoute(){ const h=stripHash(location.hash); const m=h.match(/^\/projects\/([^\/]+)/); if(m){ const id=m[1]; dbGet('projects',id).then(p=>{ if(p){ const cur=state.project&&state.project.id===id?state.project:p; state.project=cur; notify(); } }); } }

async function renderFull(){ const h=stripHash(location.hash); if(!state.user && !h.startsWith('/reset') && !h.startsWith('/forgot')){ if(h.startsWith('/login')) return renderAuth('login'); if(h.startsWith('/signup')) return renderAuth('signup'); if(h.startsWith('/onboarding')){ return; } location.hash='#/login'; return renderAuth('login'); }
  if(!state.user){ const m=h.startsWith('/signup')?'signup':h.startsWith('/forgot')?'forgot':h.startsWith('/reset')?'reset':'login'; return renderAuth(m); }
  if(!state.user.workspaceId){ if(h.startsWith('/onboarding')) return; location.hash='#/onboarding'; return renderOnboarding(); }
  if(!state.workspace){ state.workspace=await dbGet('workspaces',state.user.workspaceId); }
  renderShell();
}

function renderShell(){ const h=stripHash(location.hash); const isProject=h.startsWith('/projects/'); const seg=h.split('/').filter(Boolean);
  document.body.classList.toggle('offline',!state.online);
  const app=$('#app');
  const inProject = isProject && seg[1] && seg[1]!==undefined;
  const projectId = isProject? seg[1] : null;

  const workspaceSwitcher = `<button class="btn" style="font-weight:600" onclick="openWorkspaceMenu()">${state.workspace?state.workspace.logo:''}<span class="truncate" style="max-width:130px">${state.workspace?esc(state.workspace.name):''}</span>${icon('sort',14)}</button>`;

  const sidebar = `<aside class="sidebar">
    <div style="padding:16px 14px 10px">${logosvg()}</div>
    <div style="padding:0 14px 12px">${workspaceSwitcher}</div>
    <nav style="flex:1;overflow-y:auto;padding:6px 10px">
      ${NAV.map(n=>`<button class="nav-item ${h===n.r?'active':''}" data-nav="${n.r}">${icon(n.i)} ${n.l}</button>`).join('')}
      <div class="mini" style="padding:16px 11px 6px">Projects</div>
      <div id="sideprojects"></div>
      <div style="padding:8px 4px"><button class="nav-item" data-action="new-project" style="color:var(--accent-text)">${icon('plus')} New Project</button></div>
    </nav>
    <div style="padding:12px 14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px">
      <span class="avatar avatar-chip" style="background:${state.user.avatarColor}"></span>
      <div style="min-width:0;flex:1"><div class="truncate" style="font-size:13px;font-weight:600">${esc(state.user.name)}</div><div class="muted truncate" style="font-size:11px">${state.workspace?state.workspace.role:''}</div></div>
      <button class="iconbtn" style="width:30px;height:30px" data-action="user-menu" title="Account">${icon('more')}</button>
    </div>
  </aside>`;

  const topbar = `<header class="topbar">
    <button class="iconbtn" data-action="hamburger" style="display:none" id="hamburgerBtn">${icon('list')}</button>
    <div style="display:flex;align-items:center;gap:8px;min-width:0;flex:1">
      ${isProject? geriBtn(projectId):''}
      <div style="flex:1;min-width:0">
        <button class="btn btn-ghost" style="width:100%;max-width:360px;justify-content:flex-start;color:var(--text-3)" data-action="search">${icon('search')} <span class="muted" style="font-weight:400">Search…</span> <span class="km" style="margin-left:auto">⌘K</span></button>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="syncbar" id="syncbar"></div>
      <button class="iconbtn" data-action="notifications" style="position:relative">${icon('bell')}<span id="notifdot" style="position:absolute;top:-4px;right:-4px;width:16px;height:16px;background:var(--danger);color:#fff;border-radius:50%;font-size:9px;display:none;align-items:center;justify-content:center;font-weight:700"></span></button>
      ${!isProject?'':`<button class="btn btn-primary btn-sm" data-action="quickadd" id="desktopAddBtn">${icon('plus',15)} Add</button>`}
    </div>
  </header>`;

  let main='';
  if(isProject){ main = `<main class="content" id="projcontent">${sidebarloader(projectId)}</main>`; }
  else { main = `<main class="content" id="maincontent"></main>`; }

  app.innerHTML = `<div class="shell">${sidebar}<div class="main">${topbar}${main}</div></div>
    ${mobileNav(isProject,projectId)}
    <button class="quickfab" data-action="quickadd">${icon('plus',26)}</button>`;

  // bind global actions
  $$('[data-nav]',app).forEach(b=>b.onclick=()=>{ location.hash='#'+b.getAttribute('data-nav'); navigate(); });

  $$('[data-action="user-menu"]',app).forEach(b=>b.onclick=openUserMenu);
  $$('[data-action="search"]',app).forEach(b=>b.onclick=openCommandPalette);
  $$('[data-action="notifications"]',app).forEach(b=>b.onclick=openNotifications);

function geriBtn(projectId){ const p=state.project; return `<button class="iconbtn" onclick="location.hash='#/projects';navigate()">${icon('back')}</button><div style="min-width:0"><div class="truncate" style="font-weight:700;font-size:14px;line-height:1.1">${p?esc(p.name):'Project'}</div><div class="truncate muted" style="font-size:11px">${p?esc(p.code):''} · ${p?esc(p.status):''}</div></div>`; }
function sidebarloader(projectId){ return `<div><div class="skel" style="height:32px;width:240px;margin-bottom:14px"></div><div class="skel" style="height:120px;margin-bottom:14px"></div><div class="grid g3">${Array(6).fill('<div class="skel" style="height:80px"></div>').join('')}</div></div>`; }

async function loadProjectSidebar(projectId){ const p=await dbGet('projects',projectId); if(!p) { toast('Project not found','err'); location.hash='#/projects'; navigate(); return; } state.project=p; notify(); }
async function loadGlobalSidebar(){ const ps=await dbFilter('projects',x=>x.workspaceId===state.workspace.id && !x.deletedAt && x.status!=='Archived'); const el=$('#sideprojects'); if(!el) return; el.innerHTML=ps.length? ps.map(p=>`<button class="nav-item ${state.project&&state.project.id===p.id?'active':''}" data-project="${p.id}"><span style="width:8px;height:8px;border-radius:3px;background:${p.health==='at_risk'?'var(--danger)':p.health==='attention'?'var(--warn)':'var(--ok)'};flex-shrink:0"></span><span class="truncate">${esc(p.name)}</span></button>`).join('') : '<div class="muted" style="padding:6px 11px;font-size:12px">No projects yet</div>'; $$('[data-project]',el).forEach(b=>b.onclick=()=>{ location.hash='#/projects/'+b.getAttribute('data-project'); navigate(); }); }

const mobIcons={dashboard:'grid',projects:'folder',calendar:'cal',tasks:'check',site:'crane'};
function mobileNav(isProject,projectId){ const base = isProject? `/projects/${projectId}/` : '/'; const items = isProject
  ? [{r:'overview',l:'Overview',i:'grid'},{r:'tasks',l:'Tasks',i:'check'},{r:'site-diary',l:'Diary',i:'book'},{r:'construction',l:'Site',i:'crane'},{r:'documents',l:'Files',i:'doc'}]
  : [{r:'',l:'Home',i:'grid'},{r:'projects',l:'Projects',i:'folder'},{r:'calendar',l:'Calendar',i:'cal'},{r:'tasks',l:'Tasks',i:'check'},{r:'settings',l:'Settings',i:'gear'}];
  return `<nav class="mobilenav">
    ${items.slice(0,2).map(it=>`<button class="${isActiveMobile(it.r)?'active':''}" data-mnav="${it.r}">${icon(it.i,22)}<span>${it.l}</span></button>`).join('')}
    <button class="mobadd" data-action="quickadd">${icon('plus',22)}</button>
    ${items.slice(2).map(it=>`<button class="${isActiveMobile(it.r)?'active':''}" data-mnav="${it.r}">${icon(it.i,22)}<span>${it.l}</span></button>`).join('')}
  </nav>`;
  function isActiveMobile(r){ const h=stripHash(location.hash); if(isProject){ const seg=h.split('/').filter(Boolean); const cur=seg[2]||'overview'; return cur===r; } return (h==='/'+r || (r==='' && h==='/dashboard')); }
}

<div class="modal-body" style="padding:8px">
${ns.length? ns.map(n=>`<div style="display:flex;gap:12px;padding:12px 10px;border-bottom:1px solid var(--border);${n.read?'opacity:.55':''}"><span class="avatar" style="background:${n.read?'var(--surface-2)':'var(--accent)'};color:#fff">${icon({task:'check',issue:'warn',approval:'stamp',comment:'chat',sync:'wifi',rf:'q',construction:'crane'}[n.type]||'bell')}</span><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13px">${esc(n.title)}</div><div class="muted" style="font-size:12.5px">${esc(n.body)}</div><div class="muted" style="font-size:11px">${timeAgo(n.createdAt)}</div></div>${n.projectId?`<button class="iconbtn" style="width:28px;height:28px" onclick="gotoProj('${n.projectId}')">${icon('arrowR')}</button>`:''}</div>`).join('') : emptyState('flag','No notifications','You\'re all caught up.') }
</div>`); const mr=$('#markallread'); if(mr){ mr.onclick=async()=>{ for(const n of ns) if(!n.read){ n.read=true; await dbPut('notifications',n); } updateNotifBadge(); openNotifications(); }; } }

async function openCommandPalette(){ closeAllModals(); setState({cmdOpen:true});
  const back=document.createElement('div'); back.className='cmd-back'; back.innerHTML=`<div class="cmd"><input id="cmdinput" placeholder="Search projects, tasks, drawings, documents…" autocomplete="off"/><div class="cmd-res" id="cmdres"></div></div>`; back.addEventListener('click',e=>{ if(e.target===back) back.remove(); }); document.body.appendChild(back);
  const inp=$('#cmdinput'); const res=$('#cmdres');
  let all=[];
  const [projects,tasks,drawings,docs,issues,rfis]=await Promise.all([dbAll('projects'),dbAll('tasks'),dbAll('drawings'),dbAll('documents'),dbAll('issues'),dbAll('rfis')]);
  projects.forEach(p=>all.push({type:'Project',icon:'folder',title:p.name,sub:p.code+' · '+p.status,action:()=>{location.hash='#/projects/'+p.id;navigate();}}));
  tasks.forEach(t=>all.push({type:'Task',icon:'check',title:t.title,sub:((projects.find(p=>p.id===t.projectId)||{}).name||'')+' · '+t.status,action:()=>{if(t.projectId){location.hash='#/projects/'+t.projectId+'/tasks';navigate();}}}));
  drawings.forEach(d=>all.push({type:'Drawing',icon:'draw',title:d.number+' — '+d.title,sub:d.revision+' · '+d.status,action:()=>{location.hash='#/projects/'+d.projectId+'/drawings';navigate();}}));
  docs.forEach(d=>all.push({type:'Document',icon:'doc',title:d.name,sub:d.category,action:()=>{location.hash='#/projects/'+d.projectId+'/documents';navigate();}}));
  issues.forEach(ii=>all.push({type:'Issue',icon:'warn',title:ii.title,sub:ii.status,action:()=>{location.hash='#/projects/'+ii.projectId+'/issues';navigate();}}));
  rfis.forEach(r=>all.push({type:'RFI',icon:'q',title:r.number+' — '+r.subject,sub:r.status,action:()=>{location.hash='#/projects/'+r.projectId+'/rfis';navigate();}}));
  // quick actions
  const qa=[{type:'Action',icon:'plus',title:'Create Task',action:()=>{back.remove();openTaskForm()}},{type:'Action',icon:'warn',title:'Create Issue',action:()=>{back.remove();openIssueForm()}},{type:'Action',icon:'book',title:'Add Site Diary',action:()=>{back.remove();openDiaryForm()}}];
  function render(list){ res.innerHTML=list.length? list.map((r,i)=>`<button class="cmd-item ${i===0?'sel':''}" data-i="${i}"><span style="color:var(--accent)">${icon(r.icon)}</span><span>${esc(r.title)}</span><span class="muted" style="font-size:11px">${esc(r.type)} · ${esc(r.sub||'')}</span><span class="kbd">↵</span></button>`).join('') : '<div class="empty" style="padding:30px">No results.</div>'; $$('.cmd-item',res).forEach(b=>b.onclick=()=>{ const r=list[+b.getAttribute('data-i')]; back.remove(); if(r.action) r.action(); }); }
  render(all.slice(0,30));
  inp.addEventListener('input',debounce(()=>{ const q=inp.value.toLowerCase().trim(); const r= q? all.filter(x=>x.title.toLowerCase().includes(q)||(x.sub||'').toLowerCase().includes(q)) : all; render([...qa.filter(a=>a.title.toLowerCase().includes(q)),...r].slice(0,30)); },120));
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const sel=$('.cmd-item.sel',res); if(sel) sel.click(); } if(e.key==='Escape') back.remove(); });
  setTimeout(()=>inp.focus(),30);
}

function emptyState(iconName,title,desc,btnLabel,btnAction){ return `<div class="empty">${icon(iconName,34)}<h3>${esc(title)}</h3><p>${desc||''}</p>${btnLabel?`<button class="btn btn-primary" ${btnAction?`onclick="${btnAction}"`:''}>${esc(btnLabel)}</button>`:''}</div>`; }
function loading(){ return `<div class="grid g3">${Array(6).fill('<div class="skel" style="height:90px"></div>').join('')}</div><div class="skel" style="height:160px;margin-top:16px"></div>`; }
function header(title,sub,actions){ return `<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap"><div><h1 style="font-size:20px;font-weight:800;letter-spacing:-.02em;margin:0">${esc(title)}</h1>${sub?`<p class="muted" style="margin:4px 0 0">${sub}</p>`:''}</div><div style="display:flex;gap:8px;flex-wrap:wrap">${actions||''}</div></div>`; }
function card(title,body,opts){ opts=opts||{}; return `<div class="card" ${opts.style?`style="${opts.style}"`:''}><div class="card-head"><span class="card-title">${esc(title)}</span>${opts.actions||''}</div><div class="card-body">${body}</div></div>`; }
function progressBar(p,cls){ const c=cls||(p>=70?'p-ok':p>=40?'p-warn':'p-danger'); return `<div class="prog ${c}"><div style="width:${Math.min(100,p)}%"></div></div>`; }
</script>
<script>
/* ============================================================
   ROUTES — GLOBAL
   ============================================================ */
async function routeGlobal(h){ const app=$('#app'); const c=$('#maincontent'); if(!c) return; loadGlobalSidebar();
  const seg=h.split('/').filter(Boolean);
  const root=seg[0]||'dashboard';
  if(root==='projects' && seg[1]){ location.hash='#/projects/'+seg[1]; return renderFull(); }
  c.innerHTML=loading();
  switch(root){
    case 'dashboard': await renderDashboard(c); break;
    case 'projects': await renderProjects(c); break;
    case 'calendar': await renderCalendar(c); break;
    case 'tasks': await renderAllTasks(c); break;
    case 'documents': await renderAllDocuments(c); break;
    case 'team': await renderTeam(c); break;
    case 'reports': await renderReports(c); break;
    case 'settings': await renderSettings(c); break;
    default: c.innerHTML=`<h1>404</h1><p class="muted">Page not found.</p><button class="btn" onclick="location.hash='#/dashboard';navigate()">Go to Dashboard</button>`;
  }
  syncUI();
}

/* ---------- Dashboard ---------- */
async function renderDashboard(c){ const ws=state.workspace; const projects=(await dbFilter('projects',p=>p.workspaceId===ws.id && !p.deletedAt && p.status!=='Archived')).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));
  const allTasks=await dbFilter('tasks',t=>projects.some(p=>p.id===t.projectId));
  const overdue=allTasks.filter(t=>t.status!=='Completed'&&t.status!=='Cancelled'&&t.dueDate&&relDays(t.dueDate)<0);
  const dueSoon=allTasks.filter(t=>t.status!=='Completed'&&t.status!=='Cancelled'&&t.dueDate&&relDays(t.dueDate)>=0&&relDays(t.dueDate)<=7);
  const approvals=await dbFilter('approvals',a=>projects.some(p=>p.id===a.projectId)&&a.status==='Pending');
  const issues=await dbFilter('issues',i=>projects.some(p=>p.id===i.projectId)&&(i.status==='Open'||i.status==='In Progress'));
  const atRisk=projects.filter(p=>p.health==='at_risk'||p.health==='attention');
  const recentAct=await dbFilter('audit_logs',a=>{ const proj=projects.find(p=>p.id===a.projectId); return true; });
  recentAct.sort((a,b)=>b.timestamp.localeCompare(a.timestamp));
  const recentDocs=await dbFilter('documents',d=>projects.some(p=>p.id===d.projectId)); recentDocs.sort((a,b)=>b.createdAt.localeCompare(a.createdAt));

  const stat=(n,v,iconName,sub,cls)=>`<div class="card" data-nav-to="/projects" style="cursor:pointer"><div class="card-body"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div class="mini">${esc(v)}</div><div style="font-size:24px;font-weight:800;letter-spacing:-.02em">${n}</div>${sub?`<div class="muted" style="margin-top:4px">${sub}</div>`:''}</div><div style="color:${cls||'var(--accent)'}">${icon(iconName,22)}</div></div></div></div>`;

  c.innerHTML = `
  <div style="margin-bottom:20px"><h1 style="font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0">Good ${greeting()}, ${esc(firstName(state.user.name))}</h1><p class="muted" style="margin:4px 0 0">Here's what needs your attention across ${esc(ws.name)}.</p></div>
  ${!state.online?'<div class="banner offline">'+icon('wifiOff')+' You are offline. Your work is saved locally and will sync when you reconnect.</div>':''}
  <div class="grid g4" style="margin-bottom:18px">
    ${stat(projects.length,'Active projects','folder')}
    ${stat(atRisk.length,'At risk','warn','Need attention','var(--warn)')}
    ${stat(overdue.length,'Overdue tasks','clock','', 'var(--danger)')}
    ${stat(approvals.length,'Pending approvals','stamp','','var(--info)')}
  </div>

  ${recentAct.length?`<div class="section-title">Recent activity</div><div class="card" style="margin-bottom:16px"><div class="card-body" style="padding:6px 16px">${recentAct.slice(0,6).map(a=>`<div style="display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--border)"><span class="avatar" style="background:${pickColor(a.userName||'')}">${initials(a.userName)}</span><div style="flex:1;min-width:0"><span style="font-weight:500">${esc(a.userName)}</span> <span class="muted">${esc(a.action)} <b style="color:var(--text)">${esc(a.entity)}</b>${a.newValue?' → '+(esc(a.newValue)):''}</span><div class="muted" style="font-size:11px">${timeAgo(a.timestamp)}</div></div></div>`).join('')}</div></div>`:''}

  <div class="grid g2" style="margin-bottom:16px">
    <div class="card"><div class="card-head"><span class="card-title">Projects at risk</span></div><div class="card-body" style="padding:8px 16px">
      ${atRisk.length? atRisk.map(p=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="location.hash='#/projects/${p.id}';navigate()"><div style="min-width:0"><div style="font-weight:600" class="truncate">${esc(p.name)}</div><div class="muted" style="font-size:12px">${esc(p.type)} · ${esc(p.status)}</div></div>${healthBadge(p.health)}</div>`).join('') : '<p class="muted" style="margin:8px 0">All projects are on track.</p>'}
    </div></div>
    <div class="card"><div class="card-head"><span class="card-title">Needs your attention</span></div><div class="card-body" style="padding:8px 16px">
      ${overdue.slice(0,4).map(t=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="location.hash='#/projects/${t.projectId}/tasks';navigate()"><div style="min-width:0;flex:1"><div class="truncate" style="font-weight:500">${esc(t.title)}</div><div class="muted" style="font-size:11px">Due ${fmtDate(t.dueDate)}</div></div><span class="badge b-danger">Overdue</span></div>`).join('')||`<div style="padding:9px 0">${dueSoon.length? dueSoon.slice(0,4).map(t=>`<div style="display:flex;justify-content:space-between;padding:7px 0"><span class="truncate">${esc(t.title)}</span><span class="badge b-warn">Due ${fmtDate(t.dueDate)}</span></div>`).join(''):'<p class="muted" style="margin:8px 0">Nothing is overdue or due soon.</p>'}</div>`}
    </div></div>
  </div>

  <div class="grid g2">
    <div class="card"><div class="card-head"><span class="card-title">Projects</span><button class="btn btn-sm" onclick="location.hash='#/projects';navigate()">View all</button></div><div class="card-body" style="padding:8px 16px">
      ${projects.length? projects.map(p=>`<div style="display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="location.hash='#/projects/${p.id}';navigate()"><div style="flex:1;min-width:0"><div class="truncate" style="font-weight:600">${esc(p.name)}</div><div class="muted" style="font-size:12px">${esc(p.type)} · ${p.progress||0}% complete</div><div style="margin-top:6px">${progressBar(p.progress||0)}</div></div><div style="text-align:right">${statusBadge(p.status)}<div class="muted" style="font-size:11px;margin-top:4px">${fmtDate(p.targetDate)}</div></div></div>`).join('') : emptyState('folder','No projects yet','Create your first project to begin.','New Project','openProjectWizard()')}
    </div></div>
    <div class="card"><div class="card-head"><span class="card-title">Pending approvals</span></div><div class="card-body">
      ${approvals.length? approvals.slice(0,5).map(a=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)"><div style="min-width:0"><div class="truncate" style="font-weight:500">${esc(a.title)}</div><div class="muted" style="font-size:11px">${esc(a.entityType)} · ${esc(a.requestedBy)}</div></div><button class="btn btn-sm btn-primary" onclick="quickApprove('${a.id}')">Approve</button></div>`).join('') : '<p class="muted">No pending approvals.</p>'}
    </div></div>
  </div>`;
  $$('#app [data-nav-to]').forEach(el=>el.onclick=()=>{ location.hash=el.getAttribute('data-nav-to'); navigate(); });
}
window.quickApprove=async id=>{ await updateRecord('approvals',id,{status:'Approved',date:nowISO(),comment:'Approved from dashboard'},'Approval'); toast('Approved','ok'); location.hash='#/dashboard'; renderFull(); };
function greeting(){ const h=new Date().getHours(); return h<12?'morning':h<18?'afternoon':'evening'; }
function firstName(n){ return (n||'').split(' ')[0]; }
function healthBadge(h){ const m={'healthy':'Healthy','attention':'Attention','at_risk':'At Risk'}; const cls={'healthy':'b-ok','attention':'b-warn','at_risk':'b-danger'}; return `<span class="badge ${cls[h]||'b-neutral'}"><span class="dot"></span>${m[h]||esc(h)}</span>`; }

/* ---------- Projects list ---------- */
async function renderProjects(c){ const ps=(await dbFilter('projects',p=>p.workspaceId===state.workspace.id&&!p.deletedAt)).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));
  const active=ps.filter(p=>p.status!=='Archived'); const archived=ps.filter(p=>p.status==='Archived');
  c.innerHTML=header('Projects',`${active.length} active · ${archived.length} archived`,'<button class="btn btn-primary" onclick="openProjectWizard()">'+icon('plus',15)+' New Project</button>')
  + (active.length? `<div class="hgrid">${active.map(p=>projectCard(p)).join('')}</div>` : emptyState('folder','No projects','Start managing your first architecture project.','New Project','openProjectWizard()'))

function projectCard(p){ const prog=p.progress||0; return `<div class="card projcard" data-id="${p.id}" style="cursor:pointer;transition:.15s"><div class="card-body">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px"><div style="min-width:0;flex:1"><div class="truncate" style="font-weight:700;font-size:15px">${esc(p.name)}</div><div class="muted" style="font-size:12px">${esc(p.code)} · ${esc(p.type)}</div></div>${healthBadge(p.health)}</div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span class="mini">${esc(p.status)}</span><span style="font-weight:700;font-size:18px">${prog}%</span></div>

  <div class="divider" style="margin:12px 0"></div>
  <div class="muted" style="display:flex;justify-content:space-between"><span>${icon('pin',13)} ${esc(p.city)}</span><span>${icon('cal',13)} ${fmtDate(p.targetDate)}</span></div>
</div></div>`; }

/* ---------- Project creation wizard ---------- */
function openProjectWizard(){ let step=1; const data={};
  function render(){ const title=['Project','Client','Site','Schedule','Budget','Team','Brief','Review'];
    openModal(`<div class="modal-head"><div><h3 style="margin:0;font-size:15px">New Project</h3><div class="muted" style="font-size:11px">Step ${step} of 8 — ${title[step-1]}</div></div><button class="iconbtn" onclick="closeAllModals()">${icon('close')}</button></div>
    <div class="modal-body" id="wizbody">${stepBody()}</div>
    <div class="modal-foot"><button class="btn" id="wizback" ${step===1?'disabled':''}>Back</button><button class="btn btn-primary" id="wiznext">${step===8?'Finish':step===7?'Create Project':'Next'}</button></div>`,{w:620});
    $('#wizback').onclick=()=>{ if(step>1){ step--; render(); } };
    $('#wiznext').onclick=next;
    // inline type/status chips
    $$('#wizbody [data-set]').forEach(ch=>ch.onclick=()=>{ const key=ch.getAttribute('data-set'); const val=ch.getAttribute('data-val'); data[key]=val; $$('#wizbody [data-set="'+key+'"]').forEach(x=>x.classList.toggle('active',x===ch)); });
    $('#wizbody input[id],#wizbody textarea[id],#wizbody select[id]').forEach(i=>{ if(['radio','checkbox'].includes(i.type)) return; i.value=data[i.id]!==undefined?data[i.id]:''; i.addEventListener('input',()=>data[i.id]=i.value); i.addEventListener('change',()=>data[i.id]=i.value); });
  }

  function stepBody(){ if(step===1) return `<div class="field"><label>Project name *</label><input id="name" placeholder="House Alpha"/></div><div class="field"><label>Project code</label><input id="code" placeholder="HSA-2025-001"/></div>${chips('type','Project type',PROJECT_TYPES,3)}<div class="field"><label>Description</label><textarea id="description" placeholder="Brief description of the project…"></textarea></div>${chips('status','Initial status',['Planning','Concept','Design Development'],3)}`;

    if(step===6) return `<div class="field"><label>Project manager</label><select id="pmId">${teamOptions()}</select></div><div class="field"><label>Team members</label><div id="memberchips" class="pillfield"></div></div>`;

    if(step===8) return `<div style="font-size:13px">${reviewRow('Name',data.name||'—')}${reviewRow('Code',data.code||'—')}${reviewRow('Type',data.type||'—')}${reviewRow('Status',data.status||'Planning')}${reviewRow('Client',(data.clientName||'—')+' '+(data.clientCompany?'· '+data.clientCompany:''))}${reviewRow('Location',[data.city,data.country].filter(Boolean).join(', ')||'—')}${reviewRow('Schedule',(data.startDate||'—')+' → '+(data.targetDate||'—'))}${reviewRow('Budget',(data.estimatedBudget?fmtMoney(+data.estimatedBudget,data.currency||'USD'):'—'))}${reviewRow('Team',data.pm? 'PM: '+data.pm : '—')}</div>`;
  }
  function reviewRow(k,v){ return `<div style="display:flex;padding:9px 0;border-bottom:1px solid var(--border)"><span class="muted" style="width:130px;flex-shrink:0">${esc(k)}</span><span style="font-weight:500">${esc(v)}</span></div>`; }

/* ---------- Calendar ---------- */
async function renderCalendar(c){ const tasks=(await dbFilter('tasks',t=>!t.deletedAt)).filter(t=>t.dueDate); const miles=await dbFilter('milestones',m=>m.dueDate); const dates={};
  tasks.forEach(t=>{ dates[t.dueDate]=dates[t.dueDate]||[]; dates[t.dueDate].push({type:'Task',title:t.title,projectId:t.projectId,color:'var(--accent)'}); });
  miles.forEach(m=>{ dates[m.dueDate]=dates[m.dueDate]||[]; dates[m.dueDate].push({type:'Milestone',title:m.title,projectId:m.projectId,color:'var(--ok)'}); });
  const now=new Date(); const y=now.getFullYear(); const mo=now.getMonth();
  const first=new Date(y,mo,1); const startDow=(first.getDay()+6)%7; const days=new Date(y,mo+1,0).getDate();
  let cells=''; for(let i=0;i<startDow;i++) cells+='<div></div>';
  for(let d=1;d<=days;d++){ const iso=y+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); const evs=dates[iso]||[]; const today=iso===new Date().toISOString().slice(0,10); cells+=`<div class="card" style="min-height:86px;padding:6px;${today?'border-color:var(--accent)':''}"><div style="font-size:12px;font-weight:600;${today?'color:var(--accent)':''}">${d}</div>${evs.slice(0,2).map(e=>`<div style="font-size:10.5px;padding:2px 4px;border-radius:4px;background:var(--surface-2);border-left:2px solid ${e.color};margin-top:3px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" onclick="e.stopPropagation();location.hash='#/projects/${e.projectId}/${e.type==='Task'?'tasks':'planning'}';navigate()">${esc(e.title)}</div>`).join('')}${evs.length>2?`<div class="muted" style="font-size:10px">+${evs.length-2} more</div>`:''}</div>`; }
  c.innerHTML=header('Calendar','All deadlines, milestones, and tasks across projects','')
  +`<div style="display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:14px"><button class="iconbtn" id="calprev">${icon('back')}</button><span style="font-weight:700;font-size:15px">${new Date(y,mo).toLocaleDateString(undefined,{month:'long',year:'numeric'})}</span><button class="iconbtn" id="calnext">${icon('arrowR')}</button><button class="btn btn-sm" id="caltoday">Today</button></div>`
  +`<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="muted" style="text-align:center;font-size:11px;font-weight:700;text-transform:uppercase">${d}</div>`).join('')}</div>`
  +`<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">${cells}</div>`;
  $('#calprev').onclick=()=>{ openCalendarMonth(y,(mo+11)%12); }; $('#calnext').onclick=()=>{ openCalendarMonth(y,(mo+1)%12); }; $('#caltoday').onclick=()=>renderCalendar(c);
}

async function routeProject(projectId, sec='overview'){ const c=$('#projcontent'); const p=await dbGet('projects',projectId); if(!p){ c.innerHTML=emptyState('warn','Project not found','This project may have been deleted.','Back to projects',''); return; }
  state.project=p; notify();
  let html='';
  if(isClient(p) && !['overview','design','drawings','photos','discussions','approvals','reports','handover'].includes(sec)){
    html=clientPortal(p);
  } else {
    switch(sec){
      case 'overview': html=await renderProjectOverview(p); break;
      case 'brief': html=await renderBrief(p); break;
      case 'planning': html=await renderPlanning(p); break;
      case 'design': html=await renderDesign(p); break;
      case 'drawings': html=await renderDrawings(p); break;
      case 'documents': html=await renderProjectDocs(p); break;
      case 'tasks': html=await renderProjectTasks(p); break;
      case 'schedule': html=await renderSchedule(p); break;
      case 'budget': html=await renderBudget(p); break;
      case 'boq': html=await renderBOQ(p); break;
      case 'construction': html=await renderConstruction(p); break;
      case 'site-diary': html=await renderSiteDiary(p); break;
      case 'photos': html=await renderPhotos(p); break;
      case 'issues': html=await renderIssues(p); break;
      case 'rfis': html=await renderRFIs(p); break;
      case 'materials': html=await renderMaterials(p); break;
      case 'inspections': html=await renderInspections(p); break;
      case 'change-orders': html=await renderChangeOrders(p); break;
      case 'approvals': html=await renderApprovals(p); break;
      case 'discussions': html=await renderDiscussions(p); break;
      case 'reports': html=await renderProjectReports(p); break;
      case 'handover': html=await renderHandover(p); break;
      case 'archive': html=await renderArchive(p); break;
      default: html='<h1>Module not found</h1>';
    }
  }
  c.innerHTML = wrapProjectContext(p, html, sec);
  bindProjectNav(projectId);
  bindGlobalActions();
  syncUI();
}
function bindGlobalActions(){ $$('#app [data-action="search"]').forEach(b=>b.onclick=openCommandPalette); $$('#app [data-action="notifications"]').forEach(b=>b.onclick=openNotifications); $$('#app [data-action="quickadd"]').forEach(b=>b.onclick=openQuickAdd); $$('#app [data-action="user-menu"]').forEach(b=>b.onclick=openUserMenu); $$('#app [data-action="hamburger"]').forEach(b=>b.onclick=openMobileMenu); }
function bindProjectNav(projectId){ $$('#app [data-pnav]').forEach(b=>b.onclick=()=>{ location.hash='#/projects/'+projectId+'/'+b.getAttribute('data-pnav'); navigate(); }); }
function wrapProjectContext(p, html, sec){ const seg=stripHash(location.hash).split('/').filter(Boolean); const mySec=seg[2]||'overview';
  const tabs = PROJNAV.map(n=>`<button class="tab ${mySec===n.r?'active':''}" data-pnav="${n.r}">${esc(n.l)}</button>`).join('');
  const inDesktop = window.innerWidth>900;
  return `<div>
    ${state.siteMode?'<div class="banner" style="background:var(--accent-soft);color:var(--accent-text)">'+icon('hardhat')+' <b>Site Mode</b> — optimized for field use, works offline</div>':''}
    <div style="margin-bottom:14px;${inDesktop?'':'overflow-x:auto'}">
      ${inDesktop?`<div class="tabs" style="flex-wrap:wrap">${tabs}</div>`:`<div class="tabs" style="white-space:nowrap">${tabs}</div>`}
    </div>
    ${html}
  </div>`;
